<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASHFALL V2</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:Arial,Helvetica,sans-serif
}
canvas{display:block}

#menu{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
    radial-gradient(circle at 50% 45%,rgba(120,35,12,.35),transparent 40%),
    linear-gradient(#090909,#120604);
    color:white
}
.menuBox{
    text-align:center;
    width:min(700px,90%)
}
.logo{
    font-size:clamp(60px,12vw,135px);
    font-weight:900;
    letter-spacing:16px;
    text-shadow:0 0 12px #ff542e,0 0 40px #ff2600;
}
.tag{
    color:#999;
    letter-spacing:7px;
    font-size:13px;
    margin:5px 0 45px
}
.btn{
    width:280px;
    padding:17px;
    margin:8px auto;
    display:block;
    border:1px solid #ff542e;
    background:rgba(255,70,30,.08);
    color:white;
    font-weight:bold;
    letter-spacing:4px;
    font-size:18px;
    cursor:pointer
}
.btn:hover{
    background:#ff542e;
    color:#111;
    box-shadow:0 0 30px #ff542e
}
.help{
    margin-top:30px;
    color:#777;
    line-height:2;
    font-size:12px
}

#hud{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    pointer-events:none;
    color:white
}
#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%)
}
#crosshair:before,#crosshair:after{
    content:"";
    position:absolute;
    background:#fff
}
#crosshair:before{
    width:2px;
    height:18px;
    left:8px
}
#crosshair:after{
    width:18px;
    height:2px;
    top:8px
}
#top{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 20px;
    background:rgba(0,0,0,.65);
    border-left:3px solid #ff542e;
    font-size:13px;
    letter-spacing:1px
}
#stats{
    position:absolute;
    left:25px;
    bottom:25px;
    width:280px
}
.label{
    color:#aaa;
    font-size:10px;
    letter-spacing:2px;
    margin-bottom:5px
}
.bar{
    width:280px;
    height:15px;
    background:#111;
    border:1px solid #555;
    margin-bottom:12px
}
.fill{height:100%}
#health{background:#d9362b}
#stamina{background:#d9a52e}
#ammo{
    position:absolute;
    right:30px;
    bottom:25px;
    font-size:42px;
    font-weight:bold
}
#ammo small{
    color:#777;
    font-size:17px
}
#message{
    position:absolute;
    top:90px;
    left:50%;
    transform:translateX(-50%);
    color:#ffc34d;
    font-weight:bold;
    opacity:0;
    transition:.2s
}
#damage{
    position:fixed;
    inset:0;
    background:rgba(255,0,0,.3);
    opacity:0;
    pointer-events:none;
    z-index:200
}
#interact{
    position:absolute;
    bottom:130px;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    background:rgba(0,0,0,.7);
    padding:10px 18px;
    opacity:0
}
.overlay{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.82);
    color:white;
    text-align:center
}
.overlayBox{
    background:#0b0b0b;
    border:1px solid #444;
    padding:50px
}
.overlay h1{
    font-size:55px;
    letter-spacing:8px;
    margin:0 0 15px
}
.overlay p{
    color:#888
}
#death h1{color:#d9362b}
</style>
</head>

<body>

<div id="menu">
<div class="menuBox">

<div class="logo">ASHFALL</div>
<div class="tag">THE WORLD ENDED. YOU DIDN'T.</div>

<button class="btn" id="play">PLAY</button>
<button class="btn" id="full">FULLSCREEN</button>

<div class="help">
WASD — MOVE<br>
SHIFT — SPRINT<br>
MOUSE — LOOK<br>
LEFT CLICK — SHOOT<br>
R — RELOAD<br>
E — SEARCH LOOT<br>
ESC — PAUSE
</div>

</div>
</div>

<div id="hud">

<div id="top">EXPLORE THE ABANDONED TOWN</div>
<div id="crosshair"></div>

<div id="message"></div>
<div id="interact">PRESS E TO SEARCH</div>

<div id="stats">
<div class="label">HEALTH</div>
<div class="bar"><div id="health" class="fill"></div></div>

<div class="label">STAMINA</div>
<div class="bar"><div id="stamina" class="fill"></div></div>
</div>

<div id="ammo">
<span id="mag">12</span>
<small>/ <span id="reserve">120</span></small>
</div>

</div>

<div id="damage"></div>

<div id="pause" class="overlay">
<div class="overlayBox">
<h1>PAUSED</h1>
<p>Press ESC to continue</p>
<button class="btn" id="resume">RESUME</button>
</div>
</div>

<div id="death" class="overlay">
<div class="overlayBox">
<h1>YOU DIED</h1>
<p>The ashes claimed another survivor.</p>
<button class="btn" id="restart">RESPAWN</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================================================
   ASHFALL V2
========================================================= */

let scene, camera, renderer, clock;
let player, weapon;

let started=false;
let paused=false;
let dead=false;

let health=100;
let stamina=100;

let ammo=12;
let reserve=120;

let yaw=0;
let pitch=0;

let shootCooldown=0;
let reloadTime=0;
let reloading=false;

let worldClock=0;

const keys={};
const enemies=[];
const loot=[];
const colliders=[];
const fires=[];

const menu=document.getElementById("menu");
const hud=document.getElementById("hud");
const pauseScreen=document.getElementById("pause");
const deathScreen=document.getElementById("death");

const healthBar=document.getElementById("health");
const staminaBar=document.getElementById("stamina");

const mag=document.getElementById("mag");
const reserveText=document.getElementById("reserve");

const message=document.getElementById("message");
const damage=document.getElementById("damage");
const interact=document.getElementById("interact");


/* =========================================================
   TEXTURES
========================================================= */

function makeTexture(base,noise,lines=false){

    const c=document.createElement("canvas");
    c.width=256;
    c.height=256;

    const x=c.getContext("2d");

    x.fillStyle=base;
    x.fillRect(0,0,256,256);

    for(let i=0;i<900;i++){

        x.fillStyle=noise;

        const px=Math.random()*256;
        const py=Math.random()*256;
        const s=Math.random()*4+1;

        x.fillRect(px,py,s,s);
    }

    if(lines){

        x.strokeStyle="rgba(0,0,0,.18)";

        for(let i=0;i<12;i++){

            x.beginPath();
            x.moveTo(Math.random()*256,0);
            x.lineTo(Math.random()*256,256);
            x.stroke();
        }
    }

    const t=new THREE.CanvasTexture(c);

    t.wrapS=THREE.RepeatWrapping;
    t.wrapT=THREE.RepeatWrapping;

    return t;
}

const dirtTexture=makeTexture(
    "#40372d",
    "rgba(20,15,10,.35)"
);

const roadTexture=makeTexture(
    "#202020",
    "rgba(255,255,255,.06)",
    true
);

const wallTexture=makeTexture(
    "#4c4943",
    "rgba(10,10,10,.3)"
);

const brickTexture=makeTexture(
    "#53352c",
    "rgba(20,10,8,.35)",
    true
);


/* =========================================================
   INIT
========================================================= */

function init(){

    scene=new THREE.Scene();

    scene.background=new THREE.Color(0x11100f);

    scene.fog=new THREE.Fog(
        0x11100f,
        15,
        150
    );

    camera=new THREE.PerspectiveCamera(
        75,
        innerWidth/innerHeight,
        .1,
        500
    );

    renderer=new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setSize(innerWidth,innerHeight);

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,2)
    );

    renderer.shadowMap.enabled=true;

    document.body.appendChild(renderer.domElement);

    clock=new THREE.Clock();

    lighting();
    terrain();
    roads();
    town();
    forest();
    ash();
    playerSetup();

    for(let i=0;i<14;i++)
        spawnEnemy();

    events();

    animate();
}


/* =========================================================
   LIGHTING
========================================================= */

function lighting(){

    const ambient=new THREE.HemisphereLight(
        0x9aa0aa,
        0x211712,
        1.4
    );

    scene.add(ambient);

    const sun=new THREE.DirectionalLight(
        0xb8c5dd,
        1.5
    );

    sun.position.set(-60,100,-50);

    sun.castShadow=true;

    sun.shadow.mapSize.width=2048;
    sun.shadow.mapSize.height=2048;

    scene.add(sun);
}


/* =========================================================
   TERRAIN
========================================================= */

function terrain(){

    const geo=new THREE.PlaneGeometry(
        400,
        400,
        40,
        40
    );

    const pos=geo.attributes.position;

    for(let i=0;i<pos.count;i++){

        const x=pos.getX(i);
        const y=pos.getY(i);

        const height=
            Math.sin(x*.045)*.35+
            Math.cos(y*.055)*.3;

        pos.setZ(i,height);
    }

    geo.computeVertexNormals();

    const mat=new THREE.MeshStandardMaterial({
        map:dirtTexture,
        roughness:1
    });

    dirtTexture.repeat.set(12,12);

    const ground=new THREE.Mesh(
        geo,
        mat
    );

    ground.rotation.x=-Math.PI/2;

    ground.receiveShadow=true;

    scene.add(ground);
}


/* =========================================================
   ROADS
========================================================= */

function roads(){

    road(-90,0,18,400,0);
    road(90,0,18,400,0);
    road(0,-90,18,400,Math.PI/2);
    road(0,90,18,400,Math.PI/2);

    road(0,0,12,180,Math.PI/4);
}

function road(x,z,w,d,rotation){

    const geo=new THREE.PlaneGeometry(w,d);

    const mat=new THREE.MeshStandardMaterial({
        map:roadTexture
    });

    roadTexture.repeat.set(8,25);

    const r=new THREE.Mesh(
        geo,
        mat
    );

    r.rotation.x=-Math.PI/2;
    r.rotation.z=rotation;

    r.position.set(x,.03,z);

    scene.add(r);
}


/* =========================================================
   BUILDINGS
========================================================= */

function town(){

    house(-45,-45,18,14,"brick");
    house(-15,-45,16,13,"wall");
    house(45,-45,20,15,"brick");

    house(-45,45,17,14,"wall");
    house(15,45,20,15,"brick");
    house(48,42,15,13,"wall");

    shop(-90,25);
    school(80,0);

    fire(0,0);
    fire(55,55);
}


/* =========================================================
   ENTERABLE HOUSE
========================================================= */

function house(x,z,w,d,type){

    const group=new THREE.Group();

    const tex=
        type==="brick"
        ? brickTexture
        : wallTexture;

    tex.repeat.set(2,2);

    const material=new THREE.MeshStandardMaterial({
        map:tex,
        roughness:.9
    });

    const floor=new THREE.Mesh(
        new THREE.BoxGeometry(w,.3,d),
        new THREE.MeshStandardMaterial({
            color:0x292725
        })
    );

    floor.position.y=.15;

    group.add(floor);

    /* BACK */

    wall(group,0,3,-d/2,w,.6,material);

    /* LEFT */

    wall(group,-w/2,3,0,.6,d,material);

    /* RIGHT */

    wall(group,w/2,3,0,.6,d,material);

    /* FRONT - TWO WALLS LEAVE DOOR */

    wall(
        group,
        -(w/2-2),
        3,
        d/2,
        w-4,
        .6,
        material
    );

    wall(
        group,
        w/2-2,
        3,
        d/2,
        2,
        .6,
        material
    );

    /* ROOF */

    const roof=new THREE.Mesh(
        new THREE.BoxGeometry(
            w+.8,
            .5,
            d+.8
        ),
        new THREE.MeshStandardMaterial({
            color:0x292521
        })
    );

    roof.position.y=6.2;

    group.add(roof);

    group.position.set(x,0,z);

    scene.add(group);

    /* COLLISION */

    addBoxCollider(
        x,
        3,
        z-d/2,
        w,
        1
    );

    addBoxCollider(
        x-w/2,
        3,
        z,
        1,
        d
    );

    addBoxCollider(
        x+w/2,
        3,
        z,
        1,
        d
    );

    addBoxCollider(
        x-(w/2+2)/2,
        3,
        z+d/2,
        w-4,
        1
    );

    addBoxCollider(
        x+w/2-1,
        3,
        z+d/2,
        2,
        1
    );

    /* INTERIOR */

    furniture(
        x-w*.2,
        z-d*.15
    );

    furniture(
        x+w*.2,
        z+d*.1
    );

    lootItem(
        x+Math.random()*4-2,
        z+Math.random()*4-2
    );
}


/* =========================================================
   WALL
========================================================= */

function wall(group,x,y,z,w,d,material){

    const m=new THREE.Mesh(
        new THREE.BoxGeometry(
            w,
            6,
            d
        ),
        material
    );

    m.position.set(x,y,z);

    m.castShadow=true;
    m.receiveShadow=true;

    group.add(m);
}


/* =========================================================
   FURNITURE
========================================================= */

function furniture(x,z){

    const table=new THREE.Mesh(
        new THREE.BoxGeometry(
            2.5,
            .8,
            1.2
        ),
        new THREE.MeshStandardMaterial({
            color:0x493529
        })
    );

    table.position.set(
        x,
        .6,
        z
    );

    table.castShadow=true;

    scene.add(table);

    const chair=new THREE.Mesh(
        new THREE.BoxGeometry(
            .7,
            1,
            .7
        ),
        new THREE.MeshStandardMaterial({
            color:0x332821
        })
    );

    chair.position.set(
        x+2,
        .5,
        z
    );

    scene.add(chair);
}


/* =========================================================
   SHOP
========================================================= */

function shop(x,z){

    house(x,z,25,18,"brick");

    const sign=new THREE.Mesh(
        new THREE.BoxGeometry(
            12,
            2,
            .2
        ),
        new THREE.MeshStandardMaterial({
            color:0x35100b,
            emissive:0x220400
        })
    );

    sign.position.set(
        x,
        5,
        z+9.4
    );

    scene.add(sign);

    const light=new THREE.PointLight(
        0xff7b32,
        3,
        15
    );

    light.position.set(
        x,
        4,
        z+7
    );

    scene.add(light);
}


/* =========================================================
   SCHOOL
========================================================= */

function school(x,z){

    const group=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(
            30,
            7,
            20
        ),
        new THREE.MeshStandardMaterial({
            map:wallTexture
        })
    );

    body.position.y=3.5;

    group.add(body);

    /* dark doorway */

    const door=new THREE.Mesh(
        new THREE.BoxGeometry(
            4,
            5,
            .2
        ),
        new THREE.MeshStandardMaterial({
            color:0x080808
        })
    );

    door.position.set(
        0,
        2.5,
        10.1
    );

    group.add(door);

    group.position.set(x,0,z);

    scene.add(group);

    addBoxCollider(
        x,
        3.5,
        z,
        30,
        20
    );
}


/* =========================================================
   FOREST
========================================================= */

function forest(){

    for(let i=0;i<110;i++){

        let x=
            (Math.random()-.5)*370;

        let z=
            (Math.random()-.5)*370;

        if(
            Math.abs(x)<120 &&
            Math.abs(z)<120
        ) continue;

        tree(x,z);
    }
}

function tree(x,z){

    const group=new THREE.Group();

    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .35,
            .6,
            5,
            7
        ),
        new THREE.MeshStandardMaterial({
            color:0x281b16
        })
    );

    trunk.position.y=2.5;

    const top=new THREE.Mesh(
        new THREE.ConeGeometry(
            3,
            7,
            8
        ),
        new THREE.MeshStandardMaterial({
            color:0x182018
        })
    );

    top.position.y=7;

    group.add(trunk);
    group.add(top);

    group.position.set(x,0,z);

    group.scale.setScalar(
        .7+Math.random()*.7
    );

    scene.add(group);
}


/* =========================================================
   FIRE
========================================================= */

function fire(x,z){

    const light=new THREE.PointLight(
        0xff4b1f,
        3,
        18
    );

    light.position.set(
        x,
        3,
        z
    );

    scene.add(light);

    fires.push(light);

    const base=new THREE.Mesh(
        new THREE.CylinderGeometry(
            1,
            1.3,
            .5,
            8
        ),
        new THREE.MeshStandardMaterial({
            color:0x17100c
        })
    );

    base.position.set(
        x,
        .25,
        z
    );

    scene.add(base);

    for(let i=0;i<6;i++){

        const flame=new THREE.Mesh(
            new THREE.ConeGeometry(
                .3,
                1.5,
                6
            ),
            new THREE.MeshStandardMaterial({
                color:0xff542e,
                emissive:0x662000
            })
        );

        flame.position.set(
            x+(Math.random()-.5),
            1,
            z+(Math.random()-.5)
        );

        scene.add(flame);
    }
}


/* =========================================================
   ASH PARTICLES
========================================================= */

function ash(){

    const count=2500;

    const positions=new Float32Array(
        count*3
    );

    for(let i=0;i<count;i++){

        positions[i*3]=
            (Math.random()-.5)*300;

        positions[i*3+1]=
            Math.random()*80;

        positions[i*3+2]=
            (Math.random()-.5)*300;
    }

    const geo=new THREE.BufferGeometry();

    geo.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    const mat=new THREE.PointsMaterial({
        color:0xb7b0a8,
        size:.12,
        transparent:true,
        opacity:.55
    });

    const particles=new THREE.Points(
        geo,
        mat
    );

    scene.add(particles);

    scene.userData.ash=particles;
}


/* =========================================================
   COLLISION
========================================================= */

function addBoxCollider(x,y,z,w,d){

    colliders.push({
        x:x,
        z:z,
        w:w,
        d:d
    });
}

function blocked(x,z){

    for(const c of colliders){

        if(
            x>c.x-c.w/2 &&
            x<c.x+c.w/2 &&
            z>c.z-c.d/2 &&
            z<c.z+c.d/2
        ){

            return true;
        }
    }

    return false;
}


/* =========================================================
   PLAYER
========================================================= */

function playerSetup(){

    player=new THREE.Object3D();

    player.position.set(
        0,
        0,
        20
    );

    scene.add(player);

    player.add(camera);

    camera.position.set(
        0,
        1.7,
        0
    );


    weapon=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(
            .32,
            .28,
            1.25
        ),
        new THREE.MeshStandardMaterial({
            color:0x171717,
            metalness:.8,
            roughness:.25
        })
    );

    body.position.set(
        .43,
        -.38,
        -.75
    );

    weapon.add(body);


    const barrel=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .06,
            .06,
            .8,
            12
        ),
        new THREE.MeshStandardMaterial({
            color:0x080808,
            metalness:1
        })
    );

    barrel.rotation.x=Math.PI/2;

    barrel.position.set(
        .43,
        -.38,
        -1.55
    );

    weapon.add(barrel);

    camera.add(weapon);
}


/* =========================================================
   LOOT
========================================================= */

function lootItem(x,z){

    const types=[
        "ammo",
        "medkit",
        "scrap"
    ];

    const type=
        types[
            Math.floor(
                Math.random()*types.length
            )
        ];

    let color=0xffb52e;

    if(type==="medkit")
        color=0xe8eeee;

    if(type==="scrap")
        color=0x7c7c7c;

    const box=new THREE.Mesh(
        new THREE.BoxGeometry(
            .9,
            .7,
            .9
        ),
        new THREE.MeshStandardMaterial({
            color:color
        })
    );

    box.position.set(
        x,
        .35,
        z
    );

    box.userData.type=type;
    box.userData.searched=false;

    scene.add(box);

    loot.push(box);
}


/* =========================================================
   ENEMY
========================================================= */

function spawnEnemy(){

    const enemy=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .55,
            1.2,
            4,
            8
        ),
        new THREE.MeshStandardMaterial({
            color:0x571b1b
        })
    );

    body.position.y=1.2;

    const head=new THREE.Mesh(
        new THREE.SphereGeometry(
            .5,
            12,
            12
        ),
        new THREE.MeshStandardMaterial({
            color:0x812323
        })
    );

    head.position.y=2.4;

    enemy.add(body);
    enemy.add(head);


    let x,z;

    do{

        x=(Math.random()-.5)*220;
        z=(Math.random()-.5)*220;

    }while(
        Math.hypot(x,z)<35
    );


    enemy.position.set(
        x,
        0,
        z
    );


    enemy.userData.health=100;
    enemy.userData.speed=
        1.2+Math.random()*1.3;

    enemy.userData.state="wander";

    enemy.userData.targetX=x;
    enemy.userData.targetZ=z;

    enemy.userData.attack=0;

    scene.add(enemy);

    enemies.push(enemy);
}


/* =========================================================
   ENEMY AI
========================================================= */

function enemyAI(delta){

    if(paused||dead)return;

    for(const e of enemies){

        const dist=e.position.distanceTo(
            player.position
        );

        let targetX;
        let targetZ;

        /* DETECT */

        if(dist<60){

            e.userData.state="chase";

            targetX=player.position.x;
            targetZ=player.position.z;

        }else{

            e.userData.state="wander";

            if(
                Math.hypot(
                    e.position.x-e.userData.targetX,
                    e.position.z-e.userData.targetZ
                )<3
            ){

                e.userData.targetX=
                    e.position.x+
                    (Math.random()-.5)*30;

                e.userData.targetZ=
                    e.position.z+
                    (Math.random()-.5)*30;
            }

            targetX=e.userData.targetX;
            targetZ=e.userData.targetZ;
        }


        const dx=targetX-e.position.x;
        const dz=targetZ-e.position.z;

        const len=Math.hypot(dx,dz);

        if(len>0.5){

            const speed=
                e.userData.speed*
                (e.userData.state==="chase"?1.7:1);

            const nx=e.position.x+
                dx/len*speed*delta;

            const nz=e.position.z+
                dz/len*speed*delta;

            if(!blocked(nx,nz)){

                e.position.x=nx;
                e.position.z=nz;
            }

            e.lookAt(
                targetX,
                e.position.y,
                targetZ
            );
        }


        e.userData.attack-=delta;

        if(
            dist<2.1 &&
            e.userData.attack<=0
        ){

            e.userData.attack=1;

            hurt(12);
        }
    }
}


/* =========================================================
   MOVEMENT
========================================================= */

function movement(delta){

    if(paused||dead)return;

    let f=0;
    let s=0;

    if(keys.KeyW)f++;
    if(keys.KeyS)f--;
    if(keys.KeyA)s--;
    if(keys.KeyD)s++;

    if(!f&&!s){

        stamina=Math.min(
            100,
            stamina+22*delta
        );

        return;
    }

    let speed=6;

    if(
        keys.ShiftLeft &&
        stamina>0
    ){

        speed=10;

        stamina-=35*delta;

    }else{

        stamina+=20*delta;
    }

    stamina=Math.max(
        0,
        Math.min(100,stamina)
    );


    const dir=new THREE.Vector3(
        s,
        0,
        -f
    );

    dir.normalize();

    dir.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        yaw
    );


    const nx=
        player.position.x+
        dir.x*speed*delta;

    const nz=
        player.position.z+
        dir.z*speed*delta;


    if(!blocked(nx,nz)){

        player.position.x=nx;
        player.position.z=nz;
    }
}


/* =========================================================
   SHOOTING
========================================================= */

function shoot(){

    if(
        shootCooldown>0||
        reloading||
        paused||
        dead
    )return;

    if(ammo<=0){

        reload();
        return;
    }

    ammo--;

    shootCooldown=.16;

    camera.rotation.x-=.025;

    const ray=new THREE.Raycaster();

    ray.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const objects=[];

    for(const e of enemies){

        e.traverse(o=>{

            if(o.isMesh)
                objects.push(o);

        });
    }

    const hits=
        ray.intersectObjects(
            objects,
            false
        );

    if(hits.length){

        let e=hits[0].object;

        while(
            e.parent &&
            !e.userData.health
        ){

            e=e.parent;
        }

        if(e.userData.health){

            e.userData.health-=50;

            if(e.userData.health<=0){

                const index=
                    enemies.indexOf(e);

                if(index>=0)
                    enemies.splice(index,1);

                scene.remove(e);

                lootItem(
                    e.position.x,
                    e.position.z
                );

                show("+ LOOT");
            }
        }
    }

    updateUI();
}


/* =========================================================
   RELOAD
========================================================= */

function reload(){

    if(
        reloading||
        ammo>=12||
        reserve<=0
    )return;

    reloading=true;

    reloadTime=1.2;

    show("RELOADING...");
}

function reloadUpdate(delta){

    if(!reloading)return;

    reloadTime-=delta;

    if(reloadTime<=0){

        const needed=12-ammo;

        const amount=
            Math.min(
                needed,
                reserve
            );

        ammo+=amount;

        reserve-=amount;

        reloading=false;

        updateUI();
    }
}


/* =========================================================
   LOOT SEARCH
========================================================= */

function searchLoot(){

    let nearest=null;
    let distance=3;

    for(const item of loot){

        if(!item.parent)continue;

        const d=
            item.position.distanceTo(
                player.position
            );

        if(d<distance){

            distance=d;
            nearest=item;
        }
    }

    if(!nearest){

        interact.style.opacity=0;
        return;
    }

    interact.style.opacity=1;

    if(keys.KeyE && !nearest.userData.searched){

        nearest.userData.searched=true;

        const type=
            nearest.userData.type;

        if(type==="ammo"){

            reserve+=30;

            show("+30 AMMO");

        }else if(type==="medkit"){

            health=Math.min(
                100,
                health+35
            );

            show("+35 HEALTH");

        }else{

            show("+1 SCRAP");
        }

        scene.remove(nearest);

        updateUI();
    }
}


/* =========================================================
   DAMAGE
========================================================= */

function hurt(amount){

    health-=amount;

    health=Math.max(
        0,
        health
    );

    damage.style.opacity=1;

    setTimeout(
        ()=>{
            damage.style.opacity=0;
        },
        130
    );

    updateUI();

    if(health<=0)
        die();
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    healthBar.style.width=
        health+"%";

    staminaBar.style.width=
        stamina+"%";

    mag.textContent=ammo;

    reserveText.textContent=reserve;
}

function show(text){

    message.textContent=text;
    message.style.opacity=1;

    setTimeout(
        ()=>{
            message.style.opacity=0;
        },
        1000
    );
}


/* =========================================================
   MOUSE
========================================================= */

function mouseMove(e){

    if(
        !started||
        paused||
        dead
    )return;

    yaw-=e.movementX*.002;
    pitch-=e.movementY*.002;

    pitch=Math.max(
        -1.45,
        Math.min(1.45,pitch)
    );

    player.rotation.y=yaw;
    camera.rotation.x=pitch;
}


/* =========================================================
   INPUT
========================================================= */

function events(){

    addEventListener(
        "keydown",
        e=>{
            keys[e.code]=true;

            if(e.code==="KeyR")
                reload();

            if(e.code==="Escape"){

                if(paused)
                    resumeGame();
                else
                    pauseGame();
            }
        }
    );

    addEventListener(
        "keyup",
        e=>{
            keys[e.code]=false;
        }
    );

    addEventListener(
        "mousemove",
        mouseMove
    );

    addEventListener(
        "mousedown",
        e=>{

            if(e.button===0)
                shoot();

        }
    );

    addEventListener(
        "resize",
        resize
    );

    document.addEventListener(
        "pointerlockchange",
        ()=>{

            if(
                started&&
                !dead&&
                document.pointerLockElement
                !==renderer.domElement
            ){

                paused=true;
                pauseScreen.style.display="flex";
            }
        }
    );

    document.getElementById("play").onclick=()=>{
        started=true;
        menu.style.display="none";
        hud.style.display="block";

        renderer.domElement.requestPointerLock();
    };

    document.getElementById("full").onclick=()=>{
        if(!document.fullscreenElement)
            document.documentElement.requestFullscreen();
        else
            document.exitFullscreen();
    };

    document.getElementById("resume").onclick=
        resumeGame;

    document.getElementById("restart").onclick=
        restartGame;
}


/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

    if(!started||dead)return;

    paused=true;

    pauseScreen.style.display="flex";

    if(document.pointerLockElement)
        document.exitPointerLock();
}

function resumeGame(){

    if(dead)return;

    paused=false;

    pauseScreen.style.display="none";

    renderer.domElement.requestPointerLock();
}


/* =========================================================
   DEATH
========================================================= */

function die(){

    dead=true;
    paused=true;

    if(document.pointerLockElement)
        document.exitPointerLock();

    deathScreen.style.display="flex";
}

function restartGame(){

    player.position.set(
        0,
        0,
        20
    );

    health=100;
    stamina=100;

    ammo=12;
    reserve=120;

    yaw=0;
    pitch=0;

    player.rotation.y=0;
    camera.rotation.x=0;


    for(const e of enemies)
        scene.remove(e);

    enemies.length=0;

    for(let i=0;i<14;i++)
        spawnEnemy();


    dead=false;
    paused=false;

    deathScreen.style.display="none";

    updateUI();

    renderer.domElement.requestPointerLock();
}


/* =========================================================
   WORLD UPDATE
========================================================= */

function worldUpdate(delta){

    worldClock+=delta*.018;

    const day=
        (Math.sin(worldClock)+1)/2;

    const color=new THREE.Color(
        .025+day*.08,
        .025+day*.07,
        .035+day*.08
    );

    scene.background=color;
    scene.fog.color=color;


    /* ASH MOVEMENT */

    const particles=
        scene.userData.ash;

    if(particles){

        const arr=
            particles.geometry
            .attributes
            .position
            .array;

        for(let i=0;i<arr.length;i+=3){

            arr[i+1]-=
                delta*2;

            arr[i]+=
                delta*.4;

            if(arr[i+1]<0)
                arr[i+1]=80;
        }

        particles.geometry
            .attributes
            .position
            .needsUpdate=true;
    }


    /* FIRE FLICKER */

    for(const f of fires){

        f.intensity=
            2.5+
            Math.random()*.8;
    }
}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    camera.aspect=
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
}


/* =========================================================
   LOOP
========================================================= */

function animate(){

    requestAnimationFrame(animate);

    const delta=
        Math.min(
            clock.getDelta(),
            .05
        );

    if(
        started&&
        !dead
    ){

        movement(delta);
        enemyAI(delta);
        reloadUpdate(delta);
        searchLoot();
        worldUpdate(delta);

        if(shootCooldown>0)
            shootCooldown-=delta;

        updateUI();
    }

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   START
========================================================= */

init();

</script>

</body>
</html>
