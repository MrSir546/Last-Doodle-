<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASHFALL</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

/* START SCREEN */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 50% 45%, #35130b 0%, #100706 35%, #030303 80%);
    color: white;
}

.menu {
    text-align: center;
    width: 90%;
    max-width: 700px;
}

.title {
    font-size: clamp(60px, 12vw, 130px);
    font-weight: 900;
    letter-spacing: 15px;
    text-shadow:
        0 0 10px #ff542e,
        0 0 30px #ff542e;
}

.tagline {
    margin-top: -10px;
    color: #aaa;
    letter-spacing: 6px;
    font-size: 13px;
    margin-bottom: 45px;
}

.menuButton {
    display: block;
    width: 280px;
    margin: 12px auto;
    padding: 17px;
    border: 1px solid #ff542e;
    background: rgba(255, 84, 46, 0.08);
    color: white;
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 4px;
    cursor: pointer;
}

.menuButton:hover {
    background: #ff542e;
    color: black;
}

.controls {
    margin-top: 30px;
    color: #777;
    font-size: 13px;
    line-height: 2;
}

/* HUD */

#hud {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    display: none;
    color: white;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 18px;
    height: 18px;
    transform: translate(-50%, -50%);
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    background: white;
}

#crosshair::before {
    width: 2px;
    height: 18px;
    left: 8px;
}

#crosshair::after {
    width: 18px;
    height: 2px;
    top: 8px;
}

#stats {
    position: absolute;
    bottom: 25px;
    left: 25px;
    width: 280px;
}

.label {
    color: #bbb;
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 5px;
}

.bar {
    width: 280px;
    height: 16px;
    background: #111;
    border: 1px solid #555;
    margin-bottom: 12px;
}

.barFill {
    height: 100%;
    width: 100%;
}

#healthFill {
    background: #d9362b;
}

#staminaFill {
    background: #d69c2e;
}

#ammo {
    position: absolute;
    right: 30px;
    bottom: 25px;
    font-size: 42px;
    font-weight: bold;
}

#ammo span {
    color: white;
}

#ammo small {
    color: #777;
    font-size: 18px;
}

#objective {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 22px;
    background: rgba(0,0,0,.6);
    border-left: 3px solid #ff542e;
    font-size: 13px;
}

#message {
    position: absolute;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffbd4a;
    font-weight: bold;
    opacity: 0;
}

/* DAMAGE */

#damage {
    position: fixed;
    inset: 0;
    background: rgba(255,0,0,.25);
    opacity: 0;
    pointer-events: none;
    z-index: 200;
}

/* PAUSE / DEATH */

.overlay {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.8);
    color: white;
    text-align: center;
}

.overlayBox {
    padding: 50px;
    background: #0c0c0c;
    border: 1px solid #444;
}

.overlay h1 {
    font-size: 55px;
    letter-spacing: 8px;
    margin: 0 0 20px;
}

.overlay p {
    color: #888;
    margin-bottom: 25px;
}

#deathScreen h1 {
    color: #d9362b;
}
</style>
</head>

<body>

<!-- ==============================
     START SCREEN
================================ -->

<div id="startScreen">

    <div class="menu">

        <div class="title">ASHFALL</div>

        <div class="tagline">
            THE WORLD ENDED. YOU DIDN'T.
        </div>

        <button class="menuButton" id="playButton">
            PLAY
        </button>

        <button class="menuButton" id="fullscreenButton">
            FULLSCREEN
        </button>

        <div class="controls">
            W A S D — MOVE<br>
            SHIFT — SPRINT<br>
            MOUSE — LOOK<br>
            LEFT CLICK — SHOOT<br>
            R — RELOAD<br>
            ESC — PAUSE
        </div>

    </div>

</div>


<!-- ==============================
     HUD
================================ -->

<div id="hud">

    <div id="objective">
        SEARCH THE RUINS
    </div>

    <div id="message"></div>

    <div id="crosshair"></div>

    <div id="stats">

        <div class="label">HEALTH</div>

        <div class="bar">
            <div
                id="healthFill"
                class="barFill">
            </div>
        </div>

        <div class="label">STAMINA</div>

        <div class="bar">
            <div
                id="staminaFill"
                class="barFill">
            </div>
        </div>

    </div>

    <div id="ammo">
        <span id="ammoNumber">12</span>
        <small>/ 120</small>
    </div>

</div>


<div id="damage"></div>


<!-- ==============================
     PAUSE
================================ -->

<div id="pauseScreen" class="overlay">

    <div class="overlayBox">

        <h1>PAUSED</h1>

        <p>Press ESC or click resume</p>

        <button
            class="menuButton"
            id="resumeButton">
            RESUME
        </button>

    </div>

</div>


<!-- ==============================
     DEATH
================================ -->

<div id="deathScreen" class="overlay">

    <div class="overlayBox">

        <h1>YOU DIED</h1>

        <p>The ashes claimed another survivor.</p>

        <button
            class="menuButton"
            id="restartButton">
            TRY AGAIN
        </button>

    </div>

</div>


<!-- THREE.JS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* ============================================================
   ASHFALL
   ============================================================ */

/* GAME */

let scene;
let camera;
let renderer;
let clock;

let player;

let gameStarted = false;
let gamePaused = false;
let playerDead = false;

let health = 100;
let stamina = 100;

let ammo = 12;
let reserveAmmo = 120;

let yaw = 0;
let pitch = 0;

let shootTimer = 0;
let reloadTimer = 0;
let reloading = false;

let worldTimer = 0;

const keys = {};

const enemies = [];
const loot = [];


/* HTML */

const startScreen =
    document.getElementById("startScreen");

const playButton =
    document.getElementById("playButton");

const fullscreenButton =
    document.getElementById("fullscreenButton");

const hud =
    document.getElementById("hud");

const healthFill =
    document.getElementById("healthFill");

const staminaFill =
    document.getElementById("staminaFill");

const ammoNumber =
    document.getElementById("ammoNumber");

const pauseScreen =
    document.getElementById("pauseScreen");

const deathScreen =
    document.getElementById("deathScreen");

const resumeButton =
    document.getElementById("resumeButton");

const restartButton =
    document.getElementById("restartButton");

const damageScreen =
    document.getElementById("damage");

const message =
    document.getElementById("message");


/* ============================================================
   INITIALIZE
   ============================================================ */

function init() {

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x090909);

    scene.fog =
        new THREE.Fog(
            0x090909,
            20,
            180
        );


    /* CAMERA */

    camera =
        new THREE.PerspectiveCamera(
            75,
            window.innerWidth /
            window.innerHeight,
            0.1,
            500
        );


    /* RENDERER */

    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.shadowMap.enabled = true;

    document.body.appendChild(
        renderer.domElement
    );


    /* CLOCK */

    clock =
        new THREE.Clock();


    /* LIGHTS */

    setupLights();


    /* WORLD */

    createGround();

    createBuildings();

    createTrees();

    createCrates();


    /* PLAYER */

    createPlayer();


    /* ENEMIES */

    spawnEnemies(10);


    /* EVENTS */

    window.addEventListener(
        "resize",
        resize
    );

    document.addEventListener(
        "keydown",
        keyDown
    );

    document.addEventListener(
        "keyup",
        keyUp
    );

    document.addEventListener(
        "mousemove",
        mouseMove
    );

    document.addEventListener(
        "mousedown",
        mouseDown
    );

    document.addEventListener(
        "pointerlockchange",
        pointerLockChanged
    );


    /* BUTTONS */

    playButton.onclick =
        startGame;

    fullscreenButton.onclick =
        toggleFullscreen;

    resumeButton.onclick =
        resumeGame;

    restartButton.onclick =
        restartGame;


    animate();
}


/* ============================================================
   LIGHTING
   ============================================================ */

function setupLights() {

    const ambient =
        new THREE.AmbientLight(
            0x888888,
            1.5
        );

    scene.add(ambient);


    const moon =
        new THREE.DirectionalLight(
            0x8b9fc4,
            1.8
        );

    moon.position.set(
        -80,
        100,
        -60
    );

    moon.castShadow = true;

    scene.add(moon);


    const orange =
        new THREE.PointLight(
            0xff542e,
            3,
            45
        );

    orange.position.set(
        0,
        5,
        0
    );

    scene.add(orange);
}


/* ============================================================
   GROUND
   ============================================================ */

function createGround() {

    const geometry =
        new THREE.PlaneGeometry(
            400,
            400
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x252321,
            roughness: 1
        });

    const ground =
        new THREE.Mesh(
            geometry,
            material
        );

    ground.rotation.x =
        -Math.PI / 2;

    ground.receiveShadow = true;

    scene.add(ground);
}


/* ============================================================
   BUILDINGS
   ============================================================ */

function createBuildings() {

    for (
        let i = 0;
        i < 35;
        i++
    ) {

        let x =
            (Math.random() - .5) * 320;

        let z =
            (Math.random() - .5) * 320;


        if (
            Math.abs(x) < 25 &&
            Math.abs(z) < 25
        ) {

            x += 50;

        }


        const width =
            7 + Math.random() * 10;

        const depth =
            7 + Math.random() * 10;

        const height =
            5 + Math.random() * 18;


        const geometry =
            new THREE.BoxGeometry(
                width,
                height,
                depth
            );


        const material =
            new THREE.MeshStandardMaterial({
                color:
                    new THREE.Color(
                        .08 + Math.random() * .07,
                        .07 + Math.random() * .06,
                        .06 + Math.random() * .05
                    )
            });


        const building =
            new THREE.Mesh(
                geometry,
                material
            );


        building.position.set(
            x,
            height / 2,
            z
        );


        building.castShadow = true;

        building.receiveShadow = true;

        scene.add(building);
    }
}


/* ============================================================
   TREES
   ============================================================ */

function createTrees() {

    for (
        let i = 0;
        i < 70;
        i++
    ) {

        const group =
            new THREE.Group();


        const trunk =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .35,
                    .55,
                    5,
                    7
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x241914
                })
            );

        trunk.position.y = 2.5;


        const leaves =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    3,
                    7,
                    7
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x142016
                })
            );

        leaves.position.y = 7;


        group.add(trunk);
        group.add(leaves);


        group.position.set(
            (Math.random() - .5) * 350,
            0,
            (Math.random() - .5) * 350
        );


        scene.add(group);
    }
}


/* ============================================================
   LOOT CRATES
   ============================================================ */

function createCrates() {

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        createLootCrate();
    }
}


function createLootCrate() {

    const crate =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.6,
                1.6,
                1.6
            ),
            new THREE.MeshStandardMaterial({
                color: 0x79552f
            })
        );


    crate.position.set(
        (Math.random() - .5) * 300,
        .8,
        (Math.random() - .5) * 300
    );


    crate.userData.type =
        "crate";


    scene.add(crate);

    loot.push(crate);
}


/* ============================================================
   PLAYER
   ============================================================ */

function createPlayer() {

    player =
        new THREE.Object3D();

    player.position.set(
        0,
        0,
        15
    );

    scene.add(player);


    player.add(camera);


    camera.position.set(
        0,
        1.7,
        0
    );


    /* GUN */

    const gun =
        new THREE.Group();


    const gunBody =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .3,
                .25,
                1.2
            ),
            new THREE.MeshStandardMaterial({
                color: 0x151515,
                metalness: .8
            })
        );


    gunBody.position.set(
        .45,
        -.4,
        -.8
    );


    const barrel =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .06,
                .06,
                .7,
                12
            ),
            new THREE.MeshStandardMaterial({
                color: 0x090909,
                metalness: 1
            })
        );


    barrel.rotation.x =
        Math.PI / 2;


    barrel.position.set(
        .45,
        -.4,
        -1.55
    );


    gun.add(gunBody);

    gun.add(barrel);

    camera.add(gun);
}


/* ============================================================
   ENEMIES
   ============================================================ */

function spawnEnemies(amount) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        spawnEnemy();
    }
}


function spawnEnemy() {

    const enemy =
        new THREE.Group();


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.2,
                2,
                1
            ),
            new THREE.MeshStandardMaterial({
                color: 0x691e1e
            })
        );


    body.position.y = 1;


    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .6,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color: 0x8e2929
            })
        );


    head.position.y = 2.4;


    enemy.add(body);
    enemy.add(head);


    enemy.position.set(
        (Math.random() - .5) * 250,
        0,
        (Math.random() - .5) * 250
    );


    enemy.userData.health = 100;

    enemy.userData.speed =
        1.5 + Math.random();

    enemy.userData.attackTimer = 0;


    scene.add(enemy);

    enemies.push(enemy);
}


/* ============================================================
   START
   ============================================================ */

function startGame() {

    gameStarted = true;

    gamePaused = false;

    playerDead = false;


    startScreen.style.display =
        "none";

    hud.style.display =
        "block";


    renderer.domElement.requestPointerLock();
}


/* ============================================================
   POINTER LOCK
   ============================================================ */

function pointerLockChanged() {

    if (
        !gameStarted ||
        playerDead
    ) return;


    if (
        document.pointerLockElement ===
        renderer.domElement
    ) {

        gamePaused = false;

        pauseScreen.style.display =
            "none";

    } else {

        gamePaused = true;

        pauseScreen.style.display =
            "flex";
    }
}


/* ============================================================
   MOUSE
   ============================================================ */

function mouseMove(event) {

    if (
        !gameStarted ||
        gamePaused ||
        playerDead
    ) return;


    yaw -=
        event.movementX * .002;


    pitch -=
        event.movementY * .002;


    pitch =
        Math.max(
            -1.45,
            Math.min(
                1.45,
                pitch
            )
        );


    player.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;
}


/* ============================================================
   MOUSE CLICK
   ============================================================ */

function mouseDown(event) {

    if (
        !gameStarted ||
        gamePaused ||
        playerDead
    ) return;


    if (
        event.button === 0
    ) {

        shoot();
    }
}


/* ============================================================
   KEYBOARD
   ============================================================ */

function keyDown(event) {

    keys[event.code] = true;


    if (
        event.code === "KeyR"
    ) {

        reload();
    }


    if (
        event.code === "Escape"
    ) {

        if (gamePaused) {

            resumeGame();

        } else {

            pauseGame();

        }
    }
}


function keyUp(event) {

    keys[event.code] = false;
}


/* ============================================================
   MOVEMENT
   ============================================================ */

function updateMovement(delta) {

    if (
        gamePaused ||
        playerDead
    ) return;


    let forward = 0;

    let side = 0;


    if (keys["KeyW"])
        forward++;

    if (keys["KeyS"])
        forward--;

    if (keys["KeyA"])
        side--;

    if (keys["KeyD"])
        side++;


    const moving =
        forward !== 0 ||
        side !== 0;


    let speed = 7;


    if (
        keys["ShiftLeft"] &&
        moving &&
        stamina > 0
    ) {

        speed = 12;

        stamina -=
            35 * delta;

    } else {

        stamina +=
            22 * delta;
    }


    stamina =
        Math.max(
            0,
            Math.min(
                100,
                stamina
            )
        );


    if (!moving)
        return;


    const direction =
        new THREE.Vector3(
            side,
            0,
            -forward
        );


    direction.normalize();


    direction.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        yaw
    );


    player.position.x +=
        direction.x *
        speed *
        delta;


    player.position.z +=
        direction.z *
        speed *
        delta;


    player.position.x =
        Math.max(
            -190,
            Math.min(
                190,
                player.position.x
            )
        );


    player.position.z =
        Math.max(
            -190,
            Math.min(
                190,
                player.position.z
            )
        );
}


/* ============================================================
   SHOOT
   ============================================================ */

function shoot() {

    if (
        shootTimer > 0 ||
        reloading
    ) return;


    if (
        ammo <= 0
    ) {

        reload();

        return;
    }


    ammo--;

    shootTimer =
        .15;


    updateHUD();


    /* RECOIL */

    camera.rotation.x -=
        .035;


    /* RAY */

    const ray =
        new THREE.Raycaster();


    ray.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );


    const targets = [];


    enemies.forEach(
        enemy => {

            enemy.traverse(
                object => {

                    if (
                        object.isMesh
                    ) {

                        targets.push(
                            object
                        );
                    }
                }
            );
        }
    );


    const hits =
        ray.intersectObjects(
            targets
        );


    if (
        hits.length === 0
    ) return;


    let enemy =
        hits[0].object;


    while (
        enemy &&
        enemy.parent &&
        !enemy.userData.health
    ) {

        enemy =
            enemy.parent;
    }


    if (
        enemy &&
        enemy.userData.health
    ) {

        enemy.userData.health -=
            50;


        if (
            enemy.userData.health <= 0
        ) {

            killEnemy(enemy);
        }
    }
}


/* ============================================================
   KILL ENEMY
   ============================================================ */

function killEnemy(enemy) {

    const index =
        enemies.indexOf(enemy);


    if (
        index !== -1
    ) {

        enemies.splice(
            index,
            1
        );
    }


    scene.remove(enemy);


    /* DROP LOOT */

    const drop =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .7,
                .7,
                .7
            ),
            new THREE.MeshStandardMaterial({
                color: 0xffb52e,
                emissive: 0x552000
            })
        );


    drop.position.copy(
        enemy.position
    );


    drop.position.y =
        .5;


    drop.userData.type =
        "health";


    scene.add(drop);

    loot.push(drop);
}


/* ============================================================
   ENEMY AI
   ============================================================ */

function updateEnemies(delta) {

    if (
        gamePaused ||
        playerDead
    ) return;


    enemies.forEach(
        enemy => {

            const distance =
                enemy.position.distanceTo(
                    player.position
                );


            if (
                distance < 45
            ) {

                const direction =
                    new THREE.Vector3();


                direction.subVectors(
                    player.position,
                    enemy.position
                );


                direction.y = 0;


                if (
                    direction.length() > 0
                ) {

                    direction.normalize();

                    enemy.position.addScaledVector(
                        direction,
                        enemy.userData.speed *
                        delta
                    );

                    enemy.lookAt(
                        player.position.x,
                        enemy.position.y,
                        player.position.z
                    );
                }


                enemy.userData.attackTimer -=
                    delta;


                if (
                    distance < 2 &&
                    enemy.userData.attackTimer <= 0
                ) {

                    enemy.userData.attackTimer =
                        1;

                    damagePlayer(10);
                }
            }
        }
    );
}


/* ============================================================
   DAMAGE
   ============================================================ */

function damagePlayer(amount) {

    if (playerDead)
        return;


    health -= amount;


    if (
        health < 0
    ) {

        health = 0;
    }


    damageScreen.style.opacity =
        "1";


    setTimeout(
        function() {

            damageScreen.style.opacity =
                "0";

        },
        120
    );


    updateHUD();


    if (
        health <= 0
    ) {

        die();
    }
}


/* ============================================================
   LOOT
   ============================================================ */

function updateLoot() {

    if (
        gamePaused ||
        playerDead
    ) return;


    for (
        let i = loot.length - 1;
        i >= 0;
        i--
    ) {

        const item =
            loot[i];


        if (
            !item.parent
        ) {

            loot.splice(i,1);

            continue;
        }


        const distance =
            item.position.distanceTo(
                player.position
            );


        if (
            distance < 2
        ) {

            scene.remove(item);

            loot.splice(i,1);


            if (
                item.userData.type ===
                "health"
            ) {

                health =
                    Math.min(
                        100,
                        health + 20
                    );

                showMessage(
                    "+20 HEALTH"
                );

            } else {

                reserveAmmo += 30;

                showMessage(
                    "+30 AMMO"
                );
            }


            updateHUD();
        }
    }
}


/* ============================================================
   RELOAD
   ============================================================ */

function reload() {

    if (
        reloading ||
        ammo >= 12 ||
        reserveAmmo <= 0
    ) return;


    reloading = true;

    reloadTimer = 1.3;

    showMessage(
        "RELOADING..."
    );
}


function updateReload(delta) {

    if (!reloading)
        return;


    reloadTimer -= delta;


    if (
        reloadTimer <= 0
    ) {

        const needed =
            12 - ammo;


        const amount =
            Math.min(
                needed,
                reserveAmmo
            );


        ammo += amount;

        reserveAmmo -= amount;


        reloading = false;

        updateHUD();
    }
}


/* ============================================================
   MESSAGE
   ============================================================ */

function showMessage(text) {

    message.textContent =
        text;

    message.style.opacity =
        "1";


    setTimeout(
        function() {

            message.style.opacity =
                "0";

        },
        1000
    );
}


/* ============================================================
   HUD
   ============================================================ */

function updateHUD() {

    healthFill.style.width =
        health + "%";


    staminaFill.style.width =
        stamina + "%";


    ammoNumber.textContent =
        ammo;


    document.querySelector(
        "#ammo small"
    ).textContent =
        "/ " + reserveAmmo;
}


/* ============================================================
   PAUSE
   ============================================================ */

function pauseGame() {

    if (
        !gameStarted ||
        playerDead
    ) return;


    gamePaused = true;

    pauseScreen.style.display =
        "flex";


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }
}


function resumeGame() {

    if (
        playerDead
    ) return;


    gamePaused = false;

    pauseScreen.style.display =
        "none";


    renderer.domElement.requestPointerLock();
}


/* ============================================================
   FULLSCREEN
   ============================================================ */

function toggleFullscreen() {

    if (
        !document.fullscreenElement
    ) {

        document.documentElement
            .requestFullscreen()
            .catch(
                function(error) {
                    console.log(
                        "Fullscreen error:",
                        error
                    );
                }
            );

    } else {

        document.exitFullscreen();
    }
}


/* ============================================================
   DEATH
   ============================================================ */

function die() {

    playerDead = true;

    gamePaused = true;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();
    }


    deathScreen.style.display =
        "flex";
}


/* ============================================================
   RESTART
   ============================================================ */

function restartGame() {

    /* PLAYER */

    player.position.set(
        0,
        0,
        15
    );


    yaw = 0;

    pitch = 0;

    player.rotation.y = 0;

    camera.rotation.x = 0;


    /* STATS */

    health = 100;

    stamina = 100;

    ammo = 12;

    reserveAmmo = 120;


    /* REMOVE ENEMIES */

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        scene.remove(
            enemies[i]
        );
    }


    enemies.length = 0;


    /* NEW ENEMIES */

    spawnEnemies(10);


    playerDead = false;

    gamePaused = false;


    deathScreen.style.display =
        "none";


    updateHUD();


    renderer.domElement.requestPointerLock();
}


/* ============================================================
   DAY / NIGHT
   ============================================================ */

function updateWorld(delta) {

    worldTimer +=
        delta * .02;


    const light =
        (Math.sin(worldTimer) + 1) / 2;


    const r =
        .025 + light * .06;

    const g =
        .025 + light * .06;

    const b =
        .035 + light * .08;


    const color =
        new THREE.Color(
            r,
            g,
            b
        );


    scene.background =
        color;

    scene.fog.color =
        color;
}


/* ============================================================
   RESIZE
   ============================================================ */

function resize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


/* ============================================================
   GAME LOOP
   ============================================================ */

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    if (
        gameStarted &&
        !playerDead
    ) {

        updateMovement(delta);

        updateEnemies(delta);

        updateLoot();

        updateReload(delta);

        updateWorld(delta);


        if (
            shootTimer > 0
        ) {

            shootTimer -= delta;
        }


        updateHUD();
    }


    renderer.render(
        scene,
        camera
    );
}


/* ============================================================
   START EVERYTHING
   ============================================================ */

init();

</script>

</body>
</html>
