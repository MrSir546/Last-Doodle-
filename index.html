<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>The Last Doodle</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Permanent+Marker&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: "Permanent Marker", cursive;
    }

    canvas {
      display: block;
    }

    #menu {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background:
        radial-gradient(circle, rgba(50,50,50,.35), #000 75%);
      color: white;
      text-align: center;
    }

    #menu h1 {
      font-family: "Creepster", cursive;
      font-size: clamp(55px, 9vw, 110px);
      margin: 0;
      color: #eee;
      letter-spacing: 5px;
      text-shadow:
        5px 5px #111,
        0 0 30px #555;
      transform: rotate(-2deg);
    }

    #menu p {
      font-size: 18px;
      color: #aaa;
      margin: 10px 0 30px;
    }

    #start {
      border: 3px solid white;
      background: #111;
      color: white;
      padding: 15px 35px;
      font-family: "Permanent Marker", cursive;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 5px 5px #000;
    }

    #start:hover {
      background: #7d1111;
      transform: scale(1.05);
    }

    #hud {
      position: fixed;
      left: 25px;
      bottom: 25px;
      z-index: 5;
      color: white;
      width: 270px;
      pointer-events: none;
    }

    .label {
      font-size: 18px;
      margin-bottom: 4px;
      text-shadow: 2px 2px #000;
    }

    .bar {
      width: 250px;
      height: 23px;
      border: 3px solid white;
      background: #080808;
      margin-bottom: 13px;
      box-shadow: 4px 4px #000;
    }

    #health {
      height: 100%;
      width: 100%;
      background: #b51c1c;
    }

    #stamina {
      height: 100%;
      width: 100%;
      background: #d2b800;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%);
      z-index: 5;
      pointer-events: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: white;
      box-shadow: 0 0 6px white;
    }

    #crosshair::before {
      width: 20px;
      height: 2px;
      top: 9px;
    }

    #crosshair::after {
      width: 2px;
      height: 20px;
      left: 9px;
    }

    #hint {
      position: fixed;
      right: 25px;
      bottom: 25px;
      z-index: 5;
      color: #aaa;
      text-align: right;
      font-size: 14px;
      pointer-events: none;
    }

    #warning {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      color: #a00000;
      font-family: "Creepster", cursive;
      font-size: 30px;
      text-shadow: 0 0 12px #000;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="menu">
  <h1>THE LAST DOODLE</h1>
  <p>Something is hiding inside the notebook.</p>
  <button id="start">ENTER THE DOODLE</button>
</div>

<div id="crosshair"></div>

<div id="warning">
  SOMETHING IS WATCHING...
</div>

<div id="hud">

  <div class="label">HEALTH</div>
  <div class="bar">
    <div id="health"></div>
  </div>

  <div class="label">STAMINA</div>
  <div class="bar">
    <div id="stamina"></div>
  </div>

</div>

<div id="hint">
  WASD — MOVE<br>
  SHIFT — RUN<br>
  MOUSE — LOOK<br>
  ESC — PAUSE
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

/* -------------------------
   SCENE
------------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x030303);

scene.fog = new THREE.FogExp2(
  0x050505,
  0.045
);

/* -------------------------
   CAMERA
------------------------- */

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0, 1.7, 8);

/* -------------------------
   RENDERER
------------------------- */

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

document.body.appendChild(
  renderer.domElement
);

/* -------------------------
   LIGHTING
------------------------- */

const ambient = new THREE.HemisphereLight(
  0x777777,
  0x080808,
  0.45
);

scene.add(ambient);

const moonLight = new THREE.DirectionalLight(
  0x8aaaff,
  0.6
);

moonLight.position.set(
  -5,
  10,
  4
);

moonLight.castShadow = true;

scene.add(moonLight);

/* -------------------------
   MATERIALS
------------------------- */

const floorMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x171717,
    roughness: 1
  });

const wallMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x222222,
    roughness: 1
  });

const redMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x650b0b,
    roughness: 0.9
  });

/* -------------------------
   FLOOR
------------------------- */

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  floorMaterial
);

floor.rotation.x = -Math.PI / 2;

floor.receiveShadow = true;

scene.add(floor);

/* -------------------------
   WALL FUNCTION
------------------------- */

function createWall(
  x,
  y,
  z,
  width,
  height,
  depth
) {

  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(
      width,
      height,
      depth
    ),
    wallMaterial
  );

  wall.position.set(x, y, z);

  wall.castShadow = true;
  wall.receiveShadow = true;

  scene.add(wall);
}

/* ROOM */

createWall(
  0,
  3,
  -12,
  24,
  6,
  1
);

createWall(
  -12,
  3,
  0,
  1,
  6,
  24
);

createWall(
  12,
  3,
  0,
  1,
  6,
  24
);

createWall(
  0,
  3,
  12,
  24,
  6,
  1
);

/* -------------------------
   DOODLE COLUMNS
------------------------- */

for (let i = 0; i < 12; i++) {

  const column = new THREE.Mesh(
    new THREE.BoxGeometry(
      1.2,
      4,
      1.2
    ),
    wallMaterial
  );

  column.position.set(
    (Math.random() - 0.5) * 18,
    2,
    (Math.random() - 0.5) * 18
  );

  column.castShadow = true;

  scene.add(column);
}

/* -------------------------
   RED SYMBOLS
------------------------- */

for (let i = 0; i < 8; i++) {

  const symbol = new THREE.Mesh(
    new THREE.BoxGeometry(
      0.1,
      2,
      2
    ),
    redMaterial
  );

  symbol.position.set(
    -11.4,
    2,
    -9 + i * 2.5
  );

  scene.add(symbol);
}

/* -------------------------
   MONSTER
------------------------- */

const monster = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.SphereGeometry(1.1, 16, 16),
  new THREE.MeshStandardMaterial({
    color: 0x090909
  })
);

body.scale.y = 1.5;

body.castShadow = true;

monster.add(body);

const eyeMaterial =
  new THREE.MeshBasicMaterial({
    color: 0xff2020
  });

const eye1 = new THREE.Mesh(
  new THREE.SphereGeometry(
    0.12,
    12,
    12
  ),
  eyeMaterial
);

const eye2 = eye1.clone();

eye1.position.set(
  -0.35,
  0.35,
  -0.9
);

eye2.position.set(
  0.35,
  0.35,
  -0.9
);

monster.add(eye1);
monster.add(eye2);

monster.position.set(
  0,
  1.4,
  -7
);

scene.add(monster);

/* -------------------------
   MONSTER LIGHT
------------------------- */

const monsterLight =
  new THREE.PointLight(
    0xff0000,
    2,
    8
  );

monsterLight.position.set(
  0,
  1,
  -7
);

scene.add(monsterLight);

/* -------------------------
   CONTROLS
------------------------- */

const controls =
  new PointerLockControls(
    camera,
    document.body
  );

controls.minPolarAngle =
  Math.PI * 0.25;

controls.maxPolarAngle =
  Math.PI * 0.75;

document
  .getElementById("start")
  .addEventListener(
    "click",
    () => {

      controls.lock();

    }
  );

controls.addEventListener(
  "lock",
  () => {

    document.getElementById(
      "menu"
    ).style.display = "none";

  }
);

controls.addEventListener(
  "unlock",
  () => {

    document.getElementById(
      "menu"
    ).style.display = "flex";

  }
);

/* -------------------------
   MOVEMENT
------------------------- */

const keys = {};

document.addEventListener(
  "keydown",
  event => {

    keys[
      event.key.toLowerCase()
    ] = true;

  }
);

document.addEventListener(
  "keyup",
  event => {

    keys[
      event.key.toLowerCase()
    ] = false;

  }
);

let stamina = 100;

const clock =
  new THREE.Clock();

function movePlayer(
  delta
) {

  if (!controls.isLocked)
    return;

  let moving = false;

  if (keys["w"]) {
    controls.moveForward(
      delta * 5
    );
    moving = true;
  }

  if (keys["s"]) {
    controls.moveForward(
      -delta * 5
    );
    moving = true;
  }

  if (keys["a"]) {
    controls.moveRight(
      -delta * 5
    );
    moving = true;
  }

  if (keys["d"]) {
    controls.moveRight(
      delta * 5
    );
    moving = true;
  }

  const sprinting =
    keys["shift"] &&
    moving &&
    stamina > 0;

  if (sprinting) {

    if (keys["w"])
      controls.moveForward(
        delta * 3
      );

    if (keys["s"])
      controls.moveForward(
        -delta * 3
      );

    if (keys["a"])
      controls.moveRight(
        -delta * 3
      );

    if (keys["d"])
      controls.moveRight(
        delta * 3
      );

    stamina -= delta * 30;

  } else {

    stamina += delta * 18;

  }

  stamina =
    THREE.MathUtils.clamp(
      stamina,
      0,
      100
    );

  document.getElementById(
    "stamina"
  ).style.width =
    stamina + "%";

}

/* -------------------------
   MONSTER AI
------------------------- */

function updateMonster(delta) {

  if (!controls.isLocked)
    return;

  const distance =
    monster.position.distanceTo(
      camera.position
    );

  if (distance < 14) {

    monster.lookAt(
      camera.position.x,
      monster.position.y,
      camera.position.z
    );

    if (distance > 4) {

      const direction =
        new THREE.Vector3()
          .subVectors(
            camera.position,
            monster.position
          )
          .normalize();

      monster.position.add(
        direction.multiplyScalar(
          delta * 0.7
        )
      );

    }

  }

}

/* -------------------------
   RENDER LOOP
------------------------- */

function animate() {

  requestAnimationFrame(
    animate
  );

  const delta =
    Math.min(
      clock.getDelta(),
      0.05
    );

  movePlayer(delta);

  updateMonster(delta);

  renderer.render(
    scene,
    camera
  );

}

animate();

/* -------------------------
   RESIZE
------------------------- */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
