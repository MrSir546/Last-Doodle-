<!DOCTYPE html>
<html>
<head>
  <title>The Last Doodle</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Permanent+Marker&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #030303;
      color: white;
    }

    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          ellipse at center,
          rgba(70,70,70,0.35) 0%,
          rgba(15,15,15,0.9) 48%,
          #000 100%
        );
    }

    /* =========================
       DOODLE WALLS
    ========================= */

    .wall {
      position: absolute;
      height: 100%;
      width: 24vw;
      background:
        repeating-linear-gradient(
          8deg,
          #111 0px,
          #111 8px,
          #171717 9px,
          #0d0d0d 13px
        );

      border: 4px solid #393939;

      filter:
        drop-shadow(0 0 20px #000)
        contrast(1.3);
    }

    .wall::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        repeating-linear-gradient(
          91deg,
          transparent 0px,
          transparent 30px,
          rgba(255,255,255,0.025) 31px,
          transparent 33px
        );
    }

    .left {
      left: -5vw;
      transform: skewY(10deg);
    }

    .right {
      right: -5vw;
      transform: skewY(-10deg);
    }

    /* =========================
       FLOOR
    ========================= */

    #floor {
      position: absolute;
      left: 5%;
      bottom: -8%;
      width: 90%;
      height: 55%;

      background:
        repeating-linear-gradient(
          0deg,
          #101010 0px,
          #101010 45px,
          #191919 47px
        );

      transform:
        perspective(500px)
        rotateX(42deg);

      transform-origin: bottom;

      border-top: 3px solid #555;

      box-shadow:
        inset 0 30px 50px #000,
        0 -10px 40px rgba(0,0,0,0.8);
    }

    /* =========================
       CROSSHAIR
    ========================= */

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;

      transform: translate(-50%, -50%);

      z-index: 10;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: #e8e8e8;
      box-shadow: 0 0 8px white;
    }

    #crosshair::before {
      width: 22px;
      height: 2px;
      top: 10px;
      left: 0;
    }

    #crosshair::after {
      width: 2px;
      height: 22px;
      left: 10px;
      top: 0;
    }

    /* =========================
       HUD
    ========================= */

    #hud {
      position: absolute;
      left: 28px;
      bottom: 28px;

      width: 260px;

      font-family: "Permanent Marker", cursive;

      transform: rotate(-1deg);

      z-index: 20;
    }

    .label {
      font-size: 17px;
      letter-spacing: 2px;
      margin-bottom: 5px;

      text-shadow:
        2px 2px 0 #000,
        0 0 8px #000;
    }

    .bar {
      width: 240px;
      height: 22px;

      background: #090909;

      border: 3px solid #dedede;

      transform: rotate(-1deg);

      box-shadow:
        4px 4px 0 #000,
        inset 0 0 8px #000;

      margin-bottom: 14px;
    }

    .fill {
      height: 100%;
      transition: width 0.2s;
    }

    #healthFill {
      width: 100%;

      background:
        repeating-linear-gradient(
          -45deg,
          #8e1010 0px,
          #c62828 8px,
          #721010 16px
        );

      box-shadow:
        inset 0 0 8px #ff4444,
        0 0 8px rgba(255,0,0,0.4);
    }

    #staminaFill {
      width: 100%;

      background:
        repeating-linear-gradient(
          -45deg,
          #b39b00 0px,
          #e8d21a 8px,
          #756500 16px
        );

      box-shadow:
        inset 0 0 8px #fff36a,
        0 0 8px rgba(255,230,0,0.3);
    }

    /* =========================
       TOP TEXT
    ========================= */

    #gameTitle {
      position: absolute;

      top: 24px;
      left: 50%;

      transform: translateX(-50%) rotate(-2deg);

      font-family: "Creepster", cursive;

      font-size: clamp(32px, 5vw, 65px);

      color: #e7e7e7;

      letter-spacing: 4px;

      text-shadow:
        4px 4px 0 #111,
        0 0 10px #000,
        0 0 30px rgba(255,255,255,0.15);

      z-index: 20;
    }

    /* =========================
       WARNING
    ========================= */

    #warning {
      position: absolute;

      top: 45%;
      left: 50%;

      transform:
        translate(-50%, -50%)
        rotate(-2deg);

      font-family: "Creepster", cursive;

      color: #6f0000;

      font-size: clamp(22px, 3vw, 38px);

      text-shadow:
        0 0 10px #000,
        0 0 20px #300000;

      opacity: 0.75;

      z-index: 15;
    }

    /* =========================
       VIGNETTE
    ========================= */

    #vignette {
      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse,
          transparent 35%,
          rgba(0,0,0,0.25) 55%,
          rgba(0,0,0,0.85) 100%
        );

      z-index: 12;
    }

    /* =========================
       SCRATCHES
    ========================= */

    .scratch {
      position: absolute;

      width: 2px;
      height: 100px;

      background: rgba(255,255,255,0.08);

      transform: rotate(18deg);

      pointer-events: none;
    }

    .s1 {
      left: 18%;
      top: 20%;
    }

    .s2 {
      left: 75%;
      top: 30%;
      height: 150px;
      transform: rotate(-12deg);
    }

    .s3 {
      left: 42%;
      top: 70%;
      height: 70px;
      transform: rotate(8deg);
    }

  </style>
</head>

<body>

<div id="game">

  <div class="wall left"></div>
  <div class="wall right"></div>

  <div id="floor"></div>

  <div id="gameTitle">
    THE LAST DOODLE
  </div>

  <div id="warning">
    Something is watching...
  </div>

  <div id="crosshair"></div>

  <div id="hud">

    <div class="label">HEALTH</div>

    <div class="bar">
      <div id="healthFill" class="fill"></div>
    </div>

    <div class="label">STAMINA</div>

    <div class="bar">
      <div id="staminaFill" class="fill"></div>
    </div>

  </div>

  <div class="scratch s1"></div>
  <div class="scratch s2"></div>
  <div class="scratch s3"></div>

  <div id="vignette"></div>

</div>

</body>
</html>
