<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASHFALL V3</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080807;
    font-family:Arial,sans-serif;
}
canvas{display:block}

#menu{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    background:
      radial-gradient(circle at 50% 45%,#432015 0%,#120b09 35%,#050505 75%);
}
.menu{
    text-align:center;
}
.logo{
    font-size:100px;
    font-weight:900;
    letter-spacing:15px;
    text-shadow:0 5px 30px #000;
}
.subtitle{
    color:#aaa;
    letter-spacing:6px;
    margin-bottom:45px;
}
button{
    display:block;
    width:280px;
    margin:12px auto;
    padding:16px;
    border:1px solid #d66b3c;
    background:#17120f;
    color:white;
    font-size:17px;
    letter-spacing:3px;
    cursor:pointer;
}
button:hover{
    background:#d66b3c;
    color:#111;
}

#hud{
    display:none;
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
    z-index:100;
}
#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    transform:translate(-50%,-50%);
}
#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
}
#crosshair:before{
    width:2px;height:18px;left:9px;
}
#crosshair:after{
    height:2px;width:18px;top:9px;
}

#stats{
    position:absolute;
    left:25px;
    bottom:25px;
    width:260px;
}
.label{
    font-size:11px;
    color:#aaa;
    letter-spacing:2px;
    margin:5px 0;
}
.bar{
    height:14px;
    width:260px;
    background:#111;
    border:1px solid #555;
}
.fill{
    height:100%;
}
#health{background:#b84232}
#stamina{background:#d1a43b}

#objective{
    position:absolute;
    top:22px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.6);
    padding:10px 18px;
    border-left:3px solid #d66b3c;
}

#hint{
    position:absolute;
    bottom:120px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 18px;
    background:rgba(0,0,0,.7);
    opacity:0;
}

#message{
    position:absolute;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    color:#ffd28a;
    opacity:0;
    transition:.2s;
}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:900;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.8);
    color:white;
    text-align:center;
}
.overlay h1{
    font-size:60px;
    letter-spacing:8px;
}
</style>
</head>

<body>

<div id="menu">
    <div class="menu">
        <div class="logo">ASHFALL</div>
        <div class="subtitle">SURVIVE THE DEAD CITY</div>

        <button id="play">ENTER ASHFALL</button>
        <button id="fullscreen">FULLSCREEN</button>

        <p style="color:#777;line-height:2">
            WASD — MOVE<br>
            SHIFT — SPRINT<br>
            SPACE — JUMP<br>
            MOUSE — LOOK<br>
            E — INTERACT<br>
            ESC — PAUSE
        </p>
    </div>
</div>

<div id="hud">
    <div id="crosshair"></div>
    <div id="objective">EXPLORE THE ABANDONED DISTRICT</div>
    <div id="message"></div>
    <div id="hint"></div>

    <div id="stats">
        <div class="label">HEALTH</div>
        <div class="bar">
            <div id="health" class="fill"></div>
        </div>

        <div class="label">STAMINA</div>
        <div class="bar">
            <div id="stamina" class="fill"></div>
        </div>
    </div>
</div>

<div id="pause" class="overlay">
    <div>
        <h1>PAUSED</h1>
        <button id="resume">RESUME</button>
    </div>
</div>

<div id="dead" class="overlay">
    <div>
        <h1>YOU DIED</h1>
        <button id="restart">RESPAWN</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================================================
   ASHFALL V3
   SURVIVAL / EXPLORATION FPS
========================================================= */

let scene;
let camera;
let renderer;
let clock;

let player;
let cameraPivot;

let yaw = 0;
let pitch = 0;

let velocityY = 0;
let onGround = true;

let health = 100;
let stamina = 100;

let started = false;
let paused = false;
let dead = false;

const keys = {};

const buildings = [];
const doors = [];
const enemies = [];
const loot = [];
const trees = [];
const particles = [];

const playerRadius = .45;
const gravity = 24;
const jumpPower = 8.5;


/* =========================================================
   MATERIALS
========================================================= */

const mats = {

    dirt:
        new THREE.MeshStandardMaterial({
            color:0x40352b,
            roughness:1
        }),

    dirtDark:
        new THREE.MeshStandardMaterial({
            color:0x29221d,
            roughness:1
        }),

    road:
        new THREE.MeshStandardMaterial({
            color:0x252525,
            roughness:.95
        }),

    concrete:
        new THREE.MeshStandardMaterial({
            color:0x696762,
            roughness:.95
        }),

    concreteDark:
        new THREE.MeshStandardMaterial({
            color:0x3e3d39,
            roughness:1
        }),

    brick:
        new THREE.MeshStandardMaterial({
            color:0x603d32,
            roughness:.9
        }),

    wood:
        new THREE.MeshStandardMaterial({
            color:0x49352a,
            roughness:.9
        }),

    glass:
        new THREE.MeshPhysicalMaterial({
            color:0x73909a,
            transparent:true,
            opacity:.38,
            roughness:.1,
            metalness:.1
        }),

    metal:
        new THREE.MeshStandardMaterial({
            color:0x303438,
            metalness:.8,
            roughness:.35
        }),

    enemySkin:
        new THREE.MeshStandardMaterial({
            color:0x65544b,
            roughness:1
        }),

    enemyClothes:
        new THREE.MeshStandardMaterial({
            color:0x292d2e,
            roughness:1
        }),

    enemyDark:
        new THREE.MeshStandardMaterial({
            color:0x111313
        }),

    loot:
        new THREE.MeshStandardMaterial({
            color:0xc58b3a,
            emissive:0x3a2207
        })

};


/* =========================================================
   INIT
========================================================= */

function init(){

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x151311);

    scene.fog =
        new THREE.FogExp2(
            0x151311,
            .012
        );

    camera =
        new THREE.PerspectiveCamera(
            75,
            innerWidth / innerHeight,
            .1,
            500
        );

    renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,2)
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    document.body.appendChild(
        renderer.domElement
    );

    clock = new THREE.Clock();

    createLighting();
    createTerrain();
    createRoads();
    createTown();
    createForest();
    createAsh();
    createPlayer();
    createEnemies();
    createEvents();

    animate();
}


/* =========================================================
   LIGHTING
========================================================= */

function createLighting(){

    const hemi =
        new THREE.HemisphereLight(
            0xaeb4bb,
            0x282019,
            1.25
        );

    scene.add(hemi);

    const sun =
        new THREE.DirectionalLight(
            0xd0d4c9,
            1.5
        );

    sun.position.set(
        -80,
        110,
        -60
    );

    sun.castShadow = true;

    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;

    sun.shadow.camera.left = -180;
    sun.shadow.camera.right = 180;
    sun.shadow.camera.top = 180;
    sun.shadow.camera.bottom = -180;

    scene.add(sun);
}


/* =========================================================
   TERRAIN
========================================================= */

const terrainSize = 360;
const terrainSegments = 80;

function terrainHeight(x,z){

    return (
        Math.sin(x*.035)*1.4 +
        Math.cos(z*.045)*1.1 +
        Math.sin((x+z)*.018)*2.0
    );
}

function createTerrain(){

    const geo =
        new THREE.PlaneGeometry(
            terrainSize,
            terrainSize,
            terrainSegments,
            terrainSegments
        );

    const pos =
        geo.attributes.position;

    for(let i=0;i<pos.count;i++){

        const x=pos.getX(i);
        const y=pos.getY(i);

        pos.setZ(
            i,
            terrainHeight(x,y)
        );
    }

    geo.computeVertexNormals();

    const ground =
        new THREE.Mesh(
            geo,
            mats.dirt
        );

    ground.rotation.x =
        -Math.PI/2;

    ground.receiveShadow=true;

    scene.add(ground);

    scene.userData.terrain=ground;
}


/* =========================================================
   ROADS
========================================================= */

function createRoads(){

    makeRoad(
        0,0,
        18,360,
        0
    );

    makeRoad(
        0,0,
        18,360,
        Math.PI/2
    );

    makeRoad(
        -75,0,
        10,150,
        Math.PI/2
    );

    makeRoad(
        75,0,
        10,150,
        Math.PI/2
    );
}

function makeRoad(
    x,z,width,length,rotation
){

    const road =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width,
                length
            ),
            mats.road
        );

    road.rotation.x =
        -Math.PI/2;

    road.rotation.z =
        rotation;

    road.position.set(
        x,
        terrainHeight(x,z)+.06,
        z
    );

    road.receiveShadow=true;

    scene.add(road);
}


/* =========================================================
   BUILDING SYSTEM
========================================================= */

function createTown(){

    createHouse(
        -45,-40,
        18,14,
        "BRICK HOUSE"
    );

    createHouse(
        40,-45,
        22,16,
        "APARTMENT"
    );

    createHouse(
        -48,48,
        20,15,
        "WAREHOUSE"
    );

    createHouse(
        42,45,
        17,14,
        "HOUSE"
    );

    createHouse(
        85,-25,
        24,18,
        "SHOP"
    );

    createHouse(
        -90,25,
        24,18,
        "CLINIC"
    );
}


/*
    Every house is built from individual walls.

    The front wall has a REAL GAP for the door.
    Windows are separate objects.
*/

function createHouse(
    x,z,w,d,name
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        terrainHeight(x,z),
        z
    );

    scene.add(group);

    buildings.push(group);

    const material =
        name==="BRICK HOUSE"
        ? mats.brick
        : mats.concrete;


    /* FLOOR */

    const floor =
        box(
            w,
            .35,
            d,
            mats.concreteDark
        );

    floor.position.y=.15;

    group.add(floor);


    /* BACK WALL */

    addWall(
        group,
        0,
        3,
        -d/2,
        w,
        .7,
        material
    );


    /* LEFT WALL */

    addWall(
        group,
        -w/2,
        3,
        0,
        .7,
        d,
        material
    );


    /* RIGHT WALL */

    addWall(
        group,
        w/2,
        3,
        0,
        .7,
        d,
        material
    );


    /* FRONT LEFT */

    addWall(
        group,
        -(w/2-3),
        3,
        d/2,
        w-6,
        .7,
        material
    );


    /* FRONT RIGHT */

    addWall(
        group,
        w/2-1.5,
        3,
        d/2,
        3,
        .7,
        material
    );


    /* DOOR FRAME */

    const frameMat =
        new THREE.MeshStandardMaterial({
            color:0x211b18
        });

    const frameLeft =
        box(
            .35,
            5.4,
            .45,
            frameMat
        );

    frameLeft.position.set(
        -2.7,
        2.7,
        d/2
    );

    group.add(frameLeft);


    const frameRight =
        box(
            .35,
            5.4,
            .45,
            frameMat
        );

    frameRight.position.set(
        2.7,
        2.7,
        d/2
    );

    group.add(frameRight);


    const frameTop =
        box(
            5.7,
            .35,
            .45,
            frameMat
        );

    frameTop.position.set(
        0,
        5.4,
        d/2
    );

    group.add(frameTop);


    /* REAL DOOR */

    createDoor(
        group,
        0,
        2.65,
        d/2+.1
    );


    /* WINDOWS */

    createWindow(
        group,
        -w/2-.02,
        3.4,
        -2,
        Math.PI/2
    );

    createWindow(
        group,
        w/2+.02,
        3.4,
        2,
        Math.PI/2
    );

    createWindow(
        group,
        -5,
        3.4,
        -d/2-.02,
        0
    );

    createWindow(
        group,
        6,
        3.4,
        -d/2-.02,
        0
    );


    /* ROOF */

    const roof =
        box(
            w+.8,
            .5,
            d+.8,
            mats.concreteDark
        );

    roof.position.y=6.15;

    group.add(roof);


    /* INTERIOR */

    addFurniture(
        group,
        -w*.2,
        .0
    );

    addFurniture(
        group,
        w*.2,
        -d*.2
    );

    addShelf(
        group,
        -w*.38,
        -d*.2
    );


    /* LIGHT */

    const light =
        new THREE.PointLight(
            0xffb36b,
            2.2,
            18
        );

    light.position.set(
        0,
        4.8,
        0
    );

    group.add(light);


    /* LOOT */

    createLoot(
        x+2,
        terrainHeight(x,z)+.4,
        z-2
    );
}


/* =========================================================
   WALL
========================================================= */

function addWall(
    group,
    x,y,z,
    w,h,
    material
){

    const wall =
        box(
            w,
            h,
            h===.7 ? w : .7,
            material
        );

    /*
      Correct geometry for horizontal/vertical walls.
    */

    if(w>.7){

        wall.scale.z=1;
    }

    wall.position.set(
        x,y,z
    );

    wall.castShadow=true;
    wall.receiveShadow=true;

    group.add(wall);
}


/* =========================================================
   DOORS
========================================================= */

function createDoor(
    group,
    x,y,z
){

    const door =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                5,
                5,
                .22
            ),
            mats.wood
        );

    door.position.set(
        x,y,z
    );

    door.castShadow=true;

    door.userData.open=false;
    door.userData.closedRotation=0;

    group.add(door);

    doors.push(door);
}


/* =========================================================
   WINDOWS
========================================================= */

function createWindow(
    group,
    x,y,z,
    rotation
){

    const frameMat =
        new THREE.MeshStandardMaterial({
            color:0x151515
        });

    const glass =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.5,
                2.5,
                .12
            ),
            mats.glass
        );

    glass.position.set(
        x,y,z
    );

    glass.rotation.y=rotation;

    group.add(glass);


    for(const offset of [-1.75,1.75]){

        const frame =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .18,
                    2.7,
                    .22
                ),
                frameMat
            );

        frame.position.set(
            x,
            y,
            z
        );

        frame.rotation.y=rotation;

        if(rotation===0)
            frame.position.x+=offset;
        else
            frame.position.z+=offset;

        group.add(frame);
    }


    const cross =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .15,
                2.4,
                .2
            ),
            frameMat
        );

    cross.position.set(
        x,y,z
    );

    cross.rotation.y=rotation;

    if(rotation===0)
        cross.scale.x=3.5;
    else
        cross.scale.z=3.5;

    group.add(cross);
}


/* =========================================================
   FURNITURE
========================================================= */

function addFurniture(
    group,
    x,z
){

    const table =
        box(
            3,
            .8,
            1.5,
            mats.wood
        );

    table.position.set(
        x,.7,z
    );

    table.castShadow=true;

    group.add(table);


    for(const sx of [-1,1]){

        const chair =
            box(
                .7,
                1,
                .7,
                mats.wood
            );

        chair.position.set(
            x+sx*2,
            .5,
            z
        );

        group.add(chair);
    }
}


function addShelf(group,x,z){

    const shelf =
        box(
            .8,
            3,
            3,
            mats.wood
        );

    shelf.position.set(
        x,
        1.5,
        z
    );

    group.add(shelf);
}


/* =========================================================
   TREES
========================================================= */

function createForest(){

    for(let i=0;i<150;i++){

        let x;
        let z;

        do{

            x=(Math.random()-.5)*340;
            z=(Math.random()-.5)*340;

        }while(
            Math.abs(x)<110 &&
            Math.abs(z)<110
        );

        createTree(x,z);
    }
}

function createTree(x,z){

    const group =
        new THREE.Group();

    const y =
        terrainHeight(x,z);

    group.position.set(
        x,y,z
    );

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .35,
                .55,
                5,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x30221a
            })
        );

    trunk.position.y=2.5;

    trunk.castShadow=true;

    group.add(trunk);


    const deadMat =
        new THREE.MeshStandardMaterial({
            color:0x263027,
            roughness:1
        });


    const crown1 =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                2.8,
                5,
                7
            ),
            deadMat
        );

    crown1.position.y=6;

    crown1.castShadow=true;

    group.add(crown1);


    const crown2 =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                2.1,
                4,
                7
            ),
            deadMat
        );

    crown2.position.y=9;

    crown2.castShadow=true;

    group.add(crown2);


    group.scale.setScalar(
        .7+Math.random()*.7
    );

    scene.add(group);

    trees.push(group);
}


/* =========================================================
   ROCKS
========================================================= */

function createRock(x,z){

    const rock =
        new THREE.Mesh(
            new THREE.DodecahedronGeometry(
                .5+Math.random()*1.3,
                0
            ),
            mats.dirtDark
        );

    rock.position.set(
        x,
        terrainHeight(x,z)+.5,
        z
    );

    rock.rotation.set(
        Math.random(),
        Math.random(),
        Math.random()
    );

    rock.castShadow=true;

    scene.add(rock);
}

for(let i=0;i<80;i++){

    createRock(
        (Math.random()-.5)*340,
        (Math.random()-.5)*340
    );
}


/* =========================================================
   LOOT
========================================================= */

function createLoot(x,y,z){

    const box =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .9,
                .7,
                .9
            ),
            mats.loot
        );

    box.position.set(
        x,y,z
    );

    box.castShadow=true;

    box.userData.searched=false;

    scene.add(box);

    loot.push(box);
}


/* =========================================================
   ENEMY MODEL
========================================================= */

function createEnemy(x,z){

    const enemy =
        new THREE.Group();

    const y =
        terrainHeight(x,z);

    enemy.position.set(
        x,y,z
    );


    /*
       HEAD
    */

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .48,
                16,
                12
            ),
            mats.enemySkin
        );

    head.position.y=2.45;

    head.castShadow=true;

    enemy.add(head);


    /*
       NECK
    */

    const neck =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .2,.2,.35,8
            ),
            mats.enemySkin
        );

    neck.position.y=1.95;

    enemy.add(neck);


    /*
       BODY
    */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.1,
                1.7,
                .65
            ),
            mats.enemyClothes
        );

    body.position.y=1.25;

    body.castShadow=true;

    enemy.add(body);


    /*
       ARMS
    */

    const leftArm =
        createLimb(
            .32,
            1.5,
            .32,
            mats.enemyClothes
        );

    leftArm.position.set(
        -.75,
        1.35,
        0
    );

    enemy.add(leftArm);


    const rightArm =
        createLimb(
            .32,
            1.5,
            .32,
            mats.enemyClothes
        );

    rightArm.position.set(
        .75,
        1.35,
        0
    );

    enemy.add(rightArm);


    /*
       LEGS
    */

    const leftLeg =
        createLimb(
            .38,
            1.7,
            .38,
            mats.enemyDark
        );

    leftLeg.position.set(
        -.3,
        -.05,
        0
    );

    enemy.add(leftLeg);


    const rightLeg =
        createLimb(
            .38,
            1.7,
            .38,
            mats.enemyDark
        );

    rightLeg.position.set(
        .3,
        -.05,
        0
    );

    enemy.add(rightLeg);


    /*
       EYES
    */

    const eyeMat =
        new THREE.MeshBasicMaterial({
            color:0xff6a3d
        });

    for(const ex of [-.18,.18]){

        const eye =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    .055,
                    8,
                    8
                ),
                eyeMat
            );

        eye.position.set(
            ex,
            2.5,
            -.43
        );

        enemy.add(eye);
    }


    enemy.userData={
        health:100,
        speed:1.4+Math.random()*1,
        targetX:x,
        targetZ:z,
        state:"wander",
        attack:0,
        walk:Math.random()*10
    };


    scene.add(enemy);

    enemies.push(enemy);
}

function createLimb(
    w,h,d,material
){

    return new THREE.Mesh(
        new THREE.BoxGeometry(
            w,h,d
        ),
        material
    );
}


/* =========================================================
   ENEMIES
========================================================= */

function createEnemies(){

    for(let i=0;i<16;i++){

        let x,z;

        do{

            x=(Math.random()-.5)*250;
            z=(Math.random()-.5)*250;

        }while(
            Math.hypot(x,z)<35
        );

        createEnemy(x,z);
    }
}


/* =========================================================
   ENEMY AI + WALK ANIMATION
========================================================= */

function updateEnemies(dt){

    for(const e of enemies){

        if(dead||paused)
            continue;

        const distance =
            e.position.distanceTo(
                player.position
            );


        if(distance<45){

            e.userData.state="chase";

            e.userData.targetX=
                player.position.x;

            e.userData.targetZ=
                player.position.z;

        }else{

            e.userData.state="wander";

            if(
                Math.hypot(
                    e.position.x-e.userData.targetX,
                    e.position.z-e.userData.targetZ
                )<3
            ){

                e.userData.targetX=
                    e.position.x+
                    (Math.random()-.5)*35;

                e.userData.targetZ=
                    e.position.z+
                    (Math.random()-.5)*35;
            }
        }


        const dx =
            e.userData.targetX -
            e.position.x;

        const dz =
            e.userData.targetZ -
            e.position.z;

        const length =
            Math.hypot(dx,dz);


        if(length>.5){

            const speed =
                e.userData.speed *
                (
                    e.userData.state==="chase"
                    ? 1.8
                    : 1
                );

            e.position.x +=
                dx/length *
                speed *
                dt;

            e.position.z +=
                dz/length *
                speed *
                dt;

            e.lookAt(
                e.userData.targetX,
                e.position.y,
                e.userData.targetZ
            );


            /* WALK ANIMATION */

            e.userData.walk+=dt*8;

            const swing =
                Math.sin(
                    e.userData.walk
                )*.45;

            e.children[3].rotation.x=
                swing;

            e.children[4].rotation.x=
                -swing;

            e.children[5].rotation.x=
                -swing;

            e.children[6].rotation.x=
                swing;
        }


        /*
           Enemy reaches player
        */

        e.userData.attack-=dt;

        if(
            distance<2 &&
            e.userData.attack<=0
        ){

            e.userData.attack=1;

            health-=10;

            flashDamage();

            if(health<=0)
                die();
        }
    }
}


/* =========================================================
   PLAYER
========================================================= */

function createPlayer(){

    player =
        new THREE.Object3D();

    player.position.set(
        0,
        terrainHeight(0,20)+1.7,
        20
    );

    scene.add(player);

    cameraPivot =
        new THREE.Object3D();

    player.add(cameraPivot);

    cameraPivot.add(camera);

    camera.position.set(
        0,
        0,
        0
    );
}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(dt){

    if(paused||dead)
        return;


    let forward=0;
    let strafe=0;

    if(keys.KeyW) forward++;
    if(keys.KeyS) forward--;

    if(keys.KeyD) strafe++;
    if(keys.KeyA) strafe--;


    const moving =
        forward!==0 ||
        strafe!==0;


    if(
        keys.ShiftLeft &&
        moving &&
        stamina>0
    ){

        stamina-=35*dt;

    }else{

        stamina+=20*dt;
    }

    stamina=
        Math.max(
            0,
            Math.min(100,stamina)
        );


    let speed =
        keys.ShiftLeft &&
        stamina>0
        ? 10
        : 5.5;


    if(moving){

        const length =
            Math.hypot(
                strafe,
                forward
            );

        strafe/=length;
        forward/=length;


        const dx =
            (
                Math.sin(yaw)*forward +
                Math.cos(yaw)*strafe
            ) * speed * dt;

        const dz =
            (
                -Math.cos(yaw)*forward +
                Math.sin(yaw)*strafe
            ) * speed * dt;


        player.position.x+=dx;
        player.position.z+=dz;
    }


    /*
       GRAVITY
    */

    velocityY-=gravity*dt;

    player.position.y+=
        velocityY*dt;


    /*
       Ground follows terrain.
    */

    const ground =
        terrainHeight(
            player.position.x,
            player.position.z
        )+1.7;


    if(player.position.y<=ground){

        player.position.y=ground;

        velocityY=0;

        onGround=true;

    }else{

        onGround=false;
    }
}


/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(
        onGround &&
        !paused &&
        !dead
    ){

        velocityY=jumpPower;
        onGround=false;
    }
}


/* =========================================================
   MOUSE LOOK
========================================================= */

function mouseLook(e){

    if(
        !started||
        paused||
        dead
    )return;

    yaw -=
        e.movementX*.0022;

    pitch -=
        e.movementY*.0022;

    pitch =
        Math.max(
            -1.45,
            Math.min(
                1.45,
                pitch
            )
        );

    player.rotation.y=yaw;
    camera.rotation.x=pitch;
}


/* =========================================================
   INTERACTION
========================================================= */

function interaction(){

    if(paused||dead)
        return;

    let nearest=null;
    let distance=3;


    /*
       DOORS
    */

    for(const door of doors){

        const world =
            new THREE.Vector3();

        door.getWorldPosition(world);

        const d =
            world.distanceTo(
                player.position
            );

        if(d<distance){

            nearest=door;
            distance=d;
        }
    }


    if(nearest){

        document.getElementById(
            "hint"
        ).textContent =
            "PRESS E — OPEN / CLOSE DOOR";

        document.getElementById(
            "hint"
        ).style.opacity=1;

        if(keys.KeyE){

            if(!nearest.userData.open){

                nearest.rotation.y=
                    Math.PI/2;

                nearest.userData.open=true;

            }else{

                nearest.rotation.y=0;

                nearest.userData.open=false;
            }

            keys.KeyE=false;
        }

        return;
    }


    /*
       LOOT
    */

    nearest=null;
    distance=3;

    for(const item of loot){

        if(!item.parent)
            continue;

        const d =
            item.position.distanceTo(
                player.position
            );

        if(d<distance){

            nearest=item;
            distance=d;
        }
    }


    if(nearest){

        document.getElementById(
            "hint"
        ).textContent =
            "PRESS E — COLLECT SUPPLIES";

        document.getElementById(
            "hint"
        ).style.opacity=1;

        if(keys.KeyE){

            health =
                Math.min(
                    100,
                    health+15
                );

            scene.remove(nearest);

            showMessage(
                "+ SUPPLIES + HEALTH"
            );

            keys.KeyE=false;
        }

        return;
    }


    document.getElementById(
        "hint"
    ).style.opacity=0;
}


/* =========================================================
   ASH PARTICLES
========================================================= */

function createAsh(){

    const count=2200;

    const geo=
        new THREE.BufferGeometry();

    const positions=
        new Float32Array(
            count*3
        );

    for(let i=0;i<count;i++){

        positions[i*3]=
            (Math.random()-.5)*320;

        positions[i*3+1]=
            Math.random()*80;

        positions[i*3+2]=
            (Math.random()-.5)*320;
    }

    geo.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    const mat =
        new THREE.PointsMaterial({
            color:0xbdb8b0,
            size:.13,
            transparent:true,
            opacity:.55
        });

    const p =
        new THREE.Points(
            geo,
            mat
        );

    scene.add(p);

    scene.userData.ash=p;
}


/* =========================================================
   UPDATE ASH
========================================================= */

function updateAsh(dt){

    const p =
        scene.userData.ash;

    if(!p)return;

    const arr =
        p.geometry.attributes
        .position.array;

    for(let i=1;i<arr.length;i+=3){

        arr[i]-=dt*2.2;

        if(arr[i]<0)
            arr[i]=80;
    }

    p.geometry.attributes
        .position.needsUpdate=true;
}


/* =========================================================
   DAMAGE
========================================================= */

function flashDamage(){

    const d=
        document.createElement("div");

    d.style.position="fixed";
    d.style.inset="0";
    d.style.background="rgba(180,0,0,.25)";
    d.style.zIndex="300";
    d.style.pointerEvents="none";

    document.body.appendChild(d);

    setTimeout(
        ()=>d.remove(),
        120
    );
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    const m =
        document.getElementById(
            "message"
        );

    m.textContent=text;
    m.style.opacity=1;

    setTimeout(
        ()=>{
            m.style.opacity=0;
        },
        1200
    );
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    document.getElementById(
        "health"
    ).style.width=
        health+"%";

    document.getElementById(
        "stamina"
    ).style.width=
        stamina+"%";
}


/* =========================================================
   DEATH
========================================================= */

function die(){

    dead=true;

    if(document.pointerLockElement)
        document.exitPointerLock();

    document.getElementById(
        "dead"
    ).style.display="flex";
}


function restart(){

    health=100;
    stamina=100;

    player.position.set(
        0,
        terrainHeight(0,20)+1.7,
        20
    );

    yaw=0;
    pitch=0;

    player.rotation.y=0;
    camera.rotation.x=0;

    dead=false;

    document.getElementById(
        "dead"
    ).style.display="none";

    renderer.domElement.requestPointerLock();

    updateUI();
}


/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

    if(!started||dead)
        return;

    paused=true;

    document.getElementById(
        "pause"
    ).style.display="flex";

    if(document.pointerLockElement)
        document.exitPointerLock();
}


function resumeGame(){

    paused=false;

    document.getElementById(
        "pause"
    ).style.display="none";

    renderer.domElement.requestPointerLock();
}


/* =========================================================
   EVENTS
========================================================= */

function createEvents(){

    addEventListener(
        "keydown",
        e=>{

            keys[e.code]=true;

            if(e.code==="Space"){
                e.preventDefault();
                jump();
            }

            if(e.code==="Escape"){

                if(paused)
                    resumeGame();
                else
                    pauseGame();
            }
        }
    );


    addEventListener(
        "keyup",
        e=>{
            keys[e.code]=false;
        }
    );


    addEventListener(
        "mousemove",
        mouseLook
    );


    document.getElementById(
        "play"
    ).onclick=()=>{

        started=true;

        document.getElementById(
            "menu"
        ).style.display="none";

        document.getElementById(
            "hud"
        ).style.display="block";

        renderer.domElement
            .requestPointerLock();
    };


    document.getElementById(
        "fullscreen"
    ).onclick=()=>{

        if(!document.fullscreenElement)
            document.documentElement
                .requestFullscreen();
        else
            document.exitFullscreen();
    };


    document.getElementById(
        "resume"
    ).onclick=
        resumeGame;


    document.getElementById(
        "restart"
    ).onclick=
        restart;


    addEventListener(
        "resize",
        ()=>{

            camera.aspect=
                innerWidth/innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                innerWidth,
                innerHeight
            );
        }
    );
}


/* =========================================================
   BASIC BOX
========================================================= */

function box(
    x,y,z,
    material
){

    return new THREE.Mesh(
        new THREE.BoxGeometry(
            x,y,z
        ),
        material
    );
}


/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    if(
        started &&
        !dead
    ){

        updatePlayer(dt);
        updateEnemies(dt);
        updateAsh(dt);
        interaction();
        updateUI();
    }

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   START
========================================================= */

init();

</script>
