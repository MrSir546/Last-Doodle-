<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASHFALL</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family: Arial, Helvetica, sans-serif;
}

canvas {
    display: block;
}

/* =========================
   START SCREEN
========================= */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at center, rgba(100,35,20,.25), transparent 45%),
        linear-gradient(#080808, #150a07);
    color: white;
}

#startContent {
    text-align: center;
    width: min(700px, 90%);
}

.logo {
    font-size: clamp(60px, 12vw, 140px);
    font-weight: 900;
    letter-spacing: 18px;
    color: #eee;
    text-shadow:
        0 0 10px #ff5b2e,
        0 0 35px #ff2e00;
    margin-bottom: 5px;
}

.subtitle {
    color: #aaa;
    letter-spacing: 8px;
    font-size: 14px;
    margin-bottom: 50px;
}

.startButton {
    width: 280px;
    padding: 18px;
    border: 1px solid #ff542e;
    background: rgba(255, 70, 30, .08);
    color: white;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 4px;
    cursor: pointer;
    transition: .2s;
}

.startButton:hover {
    background: #ff542e;
    color: #111;
    box-shadow: 0 0 30px #ff542e;
}

.controls {
    margin-top: 30px;
    color: #777;
    line-height: 2;
    font-size: 13px;
}

/* =========================
   HUD
========================= */

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    color: white;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 20px;
    height: 20px;
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,.9);
}

#crosshair::before {
    width: 2px;
    height: 20px;
    left: 9px;
}

#crosshair::after {
    width: 20px;
    height: 2px;
    top: 9px;
}

#bottomLeft {
    position: absolute;
    left: 25px;
    bottom: 25px;
    width: 260px;
}

.statLabel {
    font-size: 11px;
    letter-spacing: 2px;
    color: #aaa;
    margin-bottom: 5px;
}

.bar {
    width: 260px;
    height: 16px;
    background: rgba(0,0,0,.65);
    border: 1px solid #555;
    margin-bottom: 12px;
}

.barInner {
    height: 100%;
    width: 100%;
    transition: width .15s;
}

#healthBar {
    background: #d83227;
    box-shadow: 0 0 10px #d83227;
}

#staminaBar {
    background: #d6a72e;
}

#ammo {
    position: absolute;
    right: 30px;
    bottom: 25px;
    font-size: 42px;
    font-weight: bold;
    text-shadow: 0 2px 5px black;
}

#ammo small {
    font-size: 16px;
    color: #aaa;
}

#objective {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.55);
    padding: 12px 22px;
    border-left: 3px solid #ff542e;
    font-size: 14px;
    letter-spacing: 1px;
}

#lootMessage {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffd66b;
    font-weight: bold;
    opacity: 0;
    transition: .3s;
}

/* =========================
   DAMAGE EFFECT
========================= */

#damageFlash {
    position: fixed;
    inset: 0;
    z-index: 19;
    pointer-events: none;
    background: rgba(255,0,0,.25);
    opacity: 0;
}

/* =========================
   PAUSE
========================= */

#pauseScreen,
#deadScreen {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(0,0,0,.8);
    display: none;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
}

.pauseBox {
    padding: 50px;
    border: 1px solid #555;
    background: rgba(10,10,10,.9);
}

.pauseBox h1 {
    font-size: 50px;
    letter-spacing: 8px;
    margin-bottom: 25px;
}

.pauseBox p {
    color: #aaa;
    margin-bottom: 25px;
}

#deadScreen h1 {
    color: #d83227;
    font-size: 70px;
    letter-spacing: 10px;
}
</style>
</head>

<body>

<!-- =========================
     START SCREEN
========================= -->

<div id="startScreen">

    <div id="startContent">

        <div class="logo">ASHFALL</div>

        <div class="subtitle">
            THE WORLD ENDED. YOU DIDN'T.
        </div>

        <button class="startButton" id="playButton">
            PLAY
        </button>

        <br><br>

        <button class="startButton" id="fullscreenButton">
            FULLSCREEN
        </button>

        <div class="controls">
            WASD — MOVE<br>
            SHIFT — SPRINT<br>
            MOUSE — LOOK<br>
            LEFT CLICK — SHOOT<br>
            R — RELOAD<br>
            ESC — PAUSE
        </div>

    </div>

</div>

<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div id="objective">
        SEARCH THE RUINS
    </div>

    <div id="lootMessage">
        LOOT FOUND
    </div>

    <div id="crosshair"></div>

    <div id="bottomLeft">

        <div class="statLabel">HEALTH</div>

        <div class="bar">
            <div class="barInner" id="healthBar"></div>
        </div>

        <div class="statLabel">STAMINA</div>

        <div class="bar">
            <div class="barInner" id="staminaBar"></div>
        </div>

    </div>

    <div id="ammo">
        <span id="ammoCurrent">12</span>
        <small>/ 120</small>
    </div>

</div>

<div id="damageFlash"></div>

<!-- =========================
     PAUSE
========================= -->

<div id="pauseScreen">

    <div class="pauseBox">

        <h1>PAUSED</h1>

        <p>Press ESC to continue</p>

        <button class="startButton" id="resumeButton">
            RESUME
        </button>

    </div>

</div>

<!-- =========================
     DEAD
========================= -->

<div id="deadScreen">

    <div class="pauseBox">

        <h1>YOU DIED</h1>

        <p>The ashes claimed another survivor.</p>

        <button class="startButton" id="restartButton">
            TRY AGAIN
        </button>

    </div>

</div>

<!-- THREE.JS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* ============================================================
   ASHFALL
   Single-file FPS prototype
   ============================================================ */


/* =========================
   GAME VARIABLES
========================= */

let scene;
let camera;
let renderer;
let clock;

let player;
let gun;

let started = false;
let paused = false;
let dead = false;

let health = 100;
let stamina = 100;

let ammo = 12;
let reserveAmmo = 120;

let yaw = 0;
let pitch = 0;

const keys = {};

let enemies = [];
let crates = [];
let bullets = [];

let shootCooldown = 0;
let reloadTimer = 0;
let isReloading = false;

let worldTime = 0;


/* =========================
   HTML ELEMENTS
========================= */

const startScreen = document.getElementById("startScreen");
const playButton = document.getElementById("playButton");
const fullscreenButton = document.getElementById("fullscreenButton");

const healthBar = document.getElementById("healthBar");
const staminaBar = document.getElementById("staminaBar");

const ammoCurrent = document.getElementById("ammoCurrent");

const pauseScreen = document.getElementById("pauseScreen");
const resumeButton = document.getElementById("resumeButton");

const deadScreen = document.getElementById("deadScreen");
const restartButton = document.getElementById("restartButton");

const damageFlash = document.getElementById("damageFlash");
const lootMessage = document.getElementById("lootMessage");


/* =========================
   INITIALIZE
========================= */

function init() {

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x15110f);

    scene.fog = new THREE.Fog(
        0x15110f,
        20,
        180
    );


    /* CAMERA */

    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        500
    );

    camera.position.set(
        0,
        2,
        10
    );


    /* RENDERER */

    renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.shadowMap.enabled = true;

    document.body.appendChild(renderer.domElement);


    /* CLOCK */

    clock = new THREE.Clock();


    /* LIGHTING */

    createLighting();


    /* WORLD */

    createGround();

    createRoads();

    createBuildings();

    createTrees();

    createCrates();

    createEnemies();


    /* PLAYER */

    createPlayerGun();


    /* EVENTS */

    window.addEventListener(
        "resize",
        onResize
    );

    document.addEventListener(
        "keydown",
        onKeyDown
    );

    document.addEventListener(
        "keyup",
        onKeyUp
    );

    document.addEventListener(
        "mousemove",
        onMouseMove
    );

    document.addEventListener(
        "mousedown",
        onMouseDown
    );

    document.addEventListener(
        "mouseup",
        onMouseUp
    );

    renderer.domElement.addEventListener(
        "click",
        requestPointerLock
    );


    /* START */

    playButton.addEventListener(
        "click",
        startGame
    );

    fullscreenButton.addEventListener(
        "click",
        fullscreen
    );

    resumeButton.addEventListener(
        "click",
        resumeGame
    );

    restartButton.addEventListener(
        "click",
        restartGame
    );


    animate();
}


/* =========================
   LIGHTING
========================= */

function createLighting() {

    const ambient = new THREE.AmbientLight(
        0x888888,
        1.2
    );

    scene.add(ambient);


    const moon = new THREE.DirectionalLight(
        0x8899bb,
        1.5
    );

    moon.position.set(
        -50,
        100,
        -30
    );

    moon.castShadow = true;

    moon.shadow.mapSize.width = 2048;
    moon.shadow.mapSize.height = 2048;

    scene.add(moon);


    const fireLight = new THREE.PointLight(
        0xff522e,
        2,
        35
    );

    fireLight.position.set(
        0,
        5,
        0
    );

    scene.add(fireLight);

}


/* =========================
   GROUND
========================= */

function createGround() {

    const geometry =
        new THREE.PlaneGeometry(
            400,
            400
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x282521,
            roughness: 1
        });

    const ground =
        new THREE.Mesh(
            geometry,
            material
        );

    ground.rotation.x =
        -Math.PI / 2;

    ground.receiveShadow = true;

    scene.add(ground);

}


/* =========================
   ROADS
========================= */

function createRoads() {

    for (
        let i = -150;
        i <= 150;
        i += 30
    ) {

        const geometry =
            new THREE.PlaneGeometry(
                12,
                400
            );

        const material =
            new THREE.MeshStandardMaterial({
                color: 0x181818
            });

        const road =
            new THREE.Mesh(
                geometry,
                material
            );

        road.rotation.x =
            -Math.PI / 2;

        road.position.x = i;

        road.position.y = 0.01;

        scene.add(road);


        const road2 =
            road.clone();

        road2.rotation.z =
            Math.PI / 2;

        road2.position.x = 0;
        road2.position.z = i;

        scene.add(road2);

    }

}


/* =========================
   BUILDINGS
========================= */

function createBuildings() {

    for (
        let i = 0;
        i < 45;
        i++
    ) {

        const width =
            8 + Math.random() * 12;

        const height =
            5 + Math.random() * 20;

        const depth =
            8 + Math.random() * 12;


        const geometry =
            new THREE.BoxGeometry(
                width,
                height,
                depth
            );


        const material =
            new THREE.MeshStandardMaterial({
                color:
                    new THREE.Color(
                        0.08 +
                        Math.random() * 0.08,
                        0.07 +
                        Math.random() * 0.07,
                        0.06 +
                        Math.random() * 0.06
                    )
            });


        const building =
            new THREE.Mesh(
                geometry,
                material
            );


        let x =
            (Math.random() - .5)
            * 300;

        let z =
            (Math.random() - .5)
            * 300;


        /*
         Avoid spawning buildings
         too close to the player.
        */

        if (
            Math.abs(x) < 25 &&
            Math.abs(z) < 25
        ) {

            x += 50;

        }


        building.position.set(
            x,
            height / 2,
            z
        );


        building.castShadow = true;
        building.receiveShadow = true;


        scene.add(building);

    }

}


/* =========================
   TREES
========================= */

function createTrees() {

    for (
        let i = 0;
        i < 80;
        i++
    ) {

        const group =
            new THREE.Group();


        const trunkGeometry =
            new THREE.CylinderGeometry(
                .4,
                .7,
                5,
                7
            );


        const trunkMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x211813
            });


        const trunk =
            new THREE.Mesh(
                trunkGeometry,
                trunkMaterial
            );


        trunk.position.y = 2.5;


        const leavesGeometry =
            new THREE.ConeGeometry(
                3,
                7,
                7
            );


        const leavesMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x151c15
            });


        const leaves =
            new THREE.Mesh(
                leavesGeometry,
                leavesMaterial
            );


        leaves.position.y = 7;


        group.add(trunk);
        group.add(leaves);


        group.position.x =
            (Math.random() - .5) * 300;

        group.position.z =
            (Math.random() - .5) * 300;


        scene.add(group);

    }

}


/* =========================
   CRATES / LOOT
========================= */

function createCrates() {

    for (
        let i = 0;
        i < 25;
        i++
    ) {

        const geometry =
            new THREE.BoxGeometry(
                1.8,
                1.8,
                1.8
            );


        const material =
            new THREE.MeshStandardMaterial({
                color: 0x72502d
            });


        const crate =
            new THREE.Mesh(
                geometry,
                material
            );


        crate.position.set(
            (Math.random() - .5) * 250,
            .9,
            (Math.random() - .5) * 250
        );


        crate.castShadow = true;

        crate.userData.opened = false;

        scene.add(crate);

        crates.push(crate);

    }

}


/* =========================
   PLAYER
========================= */

function createPlayerGun() {

    player =
        new THREE.Group();

    scene.add(player);


    /*
    Camera is attached to player.
    */

    player.add(camera);

    camera.position.set(
        0,
        1.7,
        0
    );


    /*
    Simple weapon model.
    */

    gun =
        new THREE.Group();


    const bodyGeometry =
        new THREE.BoxGeometry(
            .3,
            .25,
            1.2
        );


    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x171717,
            metalness: .7,
            roughness: .3
        });


    const body =
        new THREE.Mesh(
            bodyGeometry,
            bodyMaterial
        );


    body.position.z = -.6;


    const barrelGeometry =
        new THREE.CylinderGeometry(
            .07,
            .07,
            .8,
            12
        );


    const barrel =
        new THREE.Mesh(
            barrelGeometry,
            bodyMaterial
        );


    barrel.rotation.x =
        Math.PI / 2;


    barrel.position.z = -1;


    gun.add(body);
    gun.add(barrel);


    gun.position.set(
        .45,
        -.45,
        -.7
    );


    camera.add(gun);

}


/* =========================
   ENEMIES
========================= */

function createEnemies() {

    for (
        let i = 0;
        i < 12;
        i++
    ) {

        createEnemy();

    }

}


function createEnemy() {

    const enemy =
        new THREE.Group();


    const bodyGeometry =
        new THREE.BoxGeometry(
            1.3,
            2,
            1
        );


    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x531c1c
        });


    const body =
        new THREE.Mesh(
            bodyGeometry,
            bodyMaterial
        );


    body.position.y = 1;


    const headGeometry =
        new THREE.SphereGeometry(
            .65,
            12,
            12
        );


    const head =
        new THREE.Mesh(
            headGeometry,
            bodyMaterial
        );


    head.position.y = 2.5;


    enemy.add(body);
    enemy.add(head);


    enemy.position.set(
        (Math.random() - .5) * 220,
        0,
        (Math.random() - .5) * 220
    );


    enemy.userData.health = 100;
    enemy.userData.speed =
        1.2 + Math.random() * .8;

    enemy.userData.attackCooldown = 0;


    scene.add(enemy);

    enemies.push(enemy);

}


/* =========================
   START GAME
========================= */

function startGame() {

    started = true;

    startScreen.style.display =
        "none";

    requestPointerLock();

}


/* =========================
   POINTER LOCK
========================= */

function requestPointerLock() {

    if (!started || dead) return;

    renderer.domElement.requestPointerLock();

}


document.addEventListener(
    "pointerlockchange",
    function() {

        if (
            document.pointerLockElement ===
            renderer.domElement
        ) {

            paused = false;
            pauseScreen.style.display =
                "none";

        } else if (
            started &&
            !dead
        ) {

            paused = true;
            pauseScreen.style.display =
                "flex";

        }

    }
);


/* =========================
   MOUSE LOOK
========================= */

function onMouseMove(event) {

    if (
        !started ||
        paused ||
        dead
    ) return;


    yaw -= event.movementX * 0.002;

    pitch -= event.movementY * 0.002;


    const limit =
        Math.PI / 2 - .05;


    pitch =
        Math.max(
            -limit,
            Math.min(
                limit,
                pitch
            )
        );


    player.rotation.y = yaw;

    camera.rotation.x = pitch;

}


/* =========================
   KEYBOARD
========================= */

function onKeyDown(event) {

    keys[event.code] = true;


    if (
        event.code === "Escape" &&
        started &&
        !dead
    ) {

        if (paused) {

            resumeGame();

        } else {

            pauseGame();

        }

    }


    if (
        event.code === "KeyR"
    ) {

        reload();

    }

}


function onKeyUp(event) {

    keys[event.code] = false;

}


/* =========================
   MOVEMENT
========================= */

function updateMovement(delta) {

    if (
        paused ||
        dead
    ) return;


    let forward = 0;
    let sideways = 0;


    if (keys["KeyW"])
        forward += 1;

    if (keys["KeyS"])
        forward -= 1;

    if (keys["KeyA"])
        sideways -= 1;

    if (keys["KeyD"])
        sideways += 1;


    const moving =
        forward !== 0 ||
        sideways !== 0;


    let speed = 7;


    const sprinting =
        keys["ShiftLeft"] &&
        stamina > 0 &&
        moving;


    if (sprinting) {

        speed = 12;

        stamina -= 30 * delta;

    } else {

        stamina += 20 * delta;

    }


    stamina =
        Math.max(
            0,
            Math.min(
                100,
                stamina
            )
        );


    if (moving) {

        const direction =
            new THREE.Vector3(
                sideways,
                0,
                -forward
            );


        direction.normalize();


        direction.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            yaw
        );


        player.position.addScaledVector(
            direction,
            speed * delta
        );

    }


    /*
    Keep player inside map.
    */

    player.position.x =
        Math.max(
            -190,
            Math.min(
                190,
                player.position.x
            )
        );


    player.position.z =
        Math.max(
            -190,
            Math.min(
                190,
                player.position.z
            )
        );

}


/* =========================
   SHOOTING
========================= */

function onMouseDown(event) {

    if (
        event.button === 0
    ) {

        shoot();

    }

}


function shoot() {

    if (
        !started ||
        paused ||
        dead ||
        isReloading
    ) return;


    if (ammo <= 0) {

        reload();

        return;

    }


    if (shootCooldown > 0)
        return;


    shootCooldown =
        .15;


    ammo--;

    updateAmmo();


    /*
    Recoil.
    */

    camera.rotation.x -= .025;


    /*
    Raycast from camera.
    */

    const raycaster =
        new THREE.Raycaster();


    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );


    const targets = [];


    enemies.forEach(
        enemy => {

            enemy.traverse(
                child => {

                    if (
                        child.isMesh
                    ) {

                        targets.push(
                            child
                        );

                    }

                }
            );

        }
    );


    const hits =
        raycaster.intersectObjects(
            targets
        );


    if (hits.length > 0) {

        const hit =
            hits[0].object;


        let target =
            hit.parent;


        while (
            target &&
            !target.userData.health
        ) {

            target =
                target.parent;

        }


        if (
            target &&
            target.userData.health
        ) {

            target.userData.health -= 50;

            /*
            Knockback.
            */

            const push =
                new THREE.Vector3();

            push.subVectors(
                target.position,
                player.position
            );

            push.y = 0;

            push.normalize();

            target.position.addScaledVector(
                push,
                1
            );


            if (
                target.userData.health <= 0
            ) {

                killEnemy(target);

            }

        }

    }

}


/* =========================
   KILL ENEMY
========================= */

function killEnemy(enemy) {

    const index =
        enemies.indexOf(enemy);


    if (index !== -1) {

        enemies.splice(
            index,
            1
        );

    }


    scene.remove(enemy);


    /*
    Spawn loot.
    */

    const geometry =
        new THREE.BoxGeometry(
            .8,
            .8,
            .8
        );


    const material =
        new THREE.MeshStandardMaterial({
            color: 0xffb52e,
            emissive: 0x5a2600
        });


    const loot =
        new THREE.Mesh(
            geometry,
            material
        );


    loot.position.copy(
        enemy.position
    );

    loot.position.y = .5;


    loot.userData.loot = true;

    scene.add(loot);

    crates.push(loot);

}


/* =========================
   RELOAD
========================= */

function reload() {

    if (
        isReloading ||
        ammo >= 12 ||
        reserveAmmo <= 0
    ) return;


    isReloading = true;

    reloadTimer = 1.5;

}


function updateReload(delta) {

    if (!isReloading)
        return;


    reloadTimer -= delta;


    if (
        reloadTimer <= 0
    ) {

        const needed =
            12 - ammo;


        const amount =
            Math.min(
                needed,
                reserveAmmo
            );


        ammo += amount;

        reserveAmmo -= amount;


        isReloading = false;

        updateAmmo();

    }

}


/* =========================
   AMMO UI
========================= */

function updateAmmo() {

    ammoCurrent.textContent =
        ammo;

}


/* =========================
   ENEMY AI
========================= */

function updateEnemies(delta) {

    if (
        paused ||
        dead
    ) return;


    enemies.forEach(
        enemy => {

            const distance =
                enemy.position.distanceTo(
                    player.position
                );


            /*
            Only chase nearby player.
            */

            if (
                distance < 45
            ) {

                const direction =
                    new THREE.Vector3()
                        .subVectors(
                            player.position,
                            enemy.position
                        );


                direction.y = 0;

                direction.normalize();


                enemy.position.addScaledVector(
                    direction,
                    enemy.userData.speed *
                    delta
                );


                enemy.lookAt(
                    player.position.x,
                    enemy.position.y,
                    player.position.z
                );


                enemy.userData.attackCooldown -=
                    delta;


                if (
                    distance < 2.2 &&
                    enemy.userData.attackCooldown <= 0
                ) {

                    enemy.userData.attackCooldown =
                        1.2;

                    damagePlayer(
                        10
                    );

                }

            }

        }
    );

}


/* =========================
   DAMAGE PLAYER
========================= */

function damagePlayer(amount) {

    if (dead)
        return;


    health -= amount;


    health =
        Math.max(
            0,
            health
        );


    healthBar.style.width =
        health + "%";


    damageFlash.style.opacity =
        "1";


    setTimeout(
        () => {

            damageFlash.style.opacity =
                "0";

        },
        120
    );


    if (
        health <= 0
    ) {

        die();

    }

}


/* =========================
   LOOT
========================= */

function updateLoot() {

    if (
        paused ||
        dead
    ) return;


    crates.forEach(
        (crate, index) => {

            if (
                !crate.parent
            ) return;


            const distance =
                crate.position.distanceTo(
                    player.position
                );


            if (
                distance < 2
            ) {

                /*
                Collect.
                */

                scene.remove(crate);


                showLootMessage();

                /*
                Small chance to restore health.
                */

                health =
                    Math.min(
                        100,
                        health + 15
                    );


                healthBar.style.width =
                    health + "%";


                /*
                Remove from array.
                */

                crates.splice(
                    index,
                    1
                );

            }

        }
    );

}


/* =========================
   LOOT MESSAGE
========================= */

function showLootMessage() {

    lootMessage.textContent =
        "+15 HEALTH";

    lootMessage.style.opacity =
        "1";


    setTimeout(
        () => {

            lootMessage.style.opacity =
                "0";

        },
        1000
    );

}


/* =========================
   DAY NIGHT
========================= */

function updateDayNight(delta) {

    worldTime +=
        delta * .015;


    const cycle =
        Math.sin(worldTime);


    const brightness =
        .5 + cycle * .5;


    const sky =
        new THREE.Color();


    sky.setRGB(
        .04 + brightness * .08,
        .04 + brightness * .08,
        .05 + brightness * .1
    );


    scene.background =
        sky;


    scene.fog.color =
        sky;

}


/* =========================
   SHOOT TIMER
========================= */

function updateShooting(delta) {

    if (
        shootCooldown > 0
    ) {

        shootCooldown -= delta;

    }

}


/* =========================
   HUD
========================= */

function updateHUD() {

    healthBar.style.width =
        health + "%";


    staminaBar.style.width =
        stamina + "%";


    ammoCurrent.textContent =
        ammo;

}


/* =========================
   PAUSE
========================= */

function pauseGame() {

    paused = true;

    pauseScreen.style.display =
        "flex";

    document.exitPointerLock();

}


function resumeGame() {

    paused = false;

    pauseScreen.style.display =
        "none";

    requestPointerLock();

}


/* =========================
   FULLSCREEN
========================= */

function fullscreen() {

    if (
        !document.fullscreenElement
    ) {

        document.documentElement.requestFullscreen();

    } else {

        document.exitFullscreen();

    }

}


/* =========================
   DEATH
========================= */

function die() {

    dead = true;

    paused = true;

    document.exitPointerLock();

    deadScreen.style.display =
        "flex";

}


function restartGame() {

    /*
    Reset player.
    */

    health = 100;

    stamina = 100;

    ammo = 12;

    reserveAmmo = 120;

    dead = false;

    paused = false;


    player.position.set(
        0,
        0,
        10
    );


    yaw = 0;

    pitch = 0;

    player.rotation.y = 0;

    camera.rotation.x = 0;


    /*
    Remove old enemies.
    */

    enemies.forEach(
        enemy => {

            scene.remove(enemy);

        }
    );


    enemies = [];


    /*
    Spawn new enemies.
    */

    createEnemies();


    deadScreen.style.display =
        "none";


    updateHUD();

    requestPointerLock();

}


/* =========================
   RESIZE
========================= */

function onResize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =========================
   MAIN LOOP
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    if (
        started &&
        !dead
    ) {

        updateMovement(delta);

        updateEnemies(delta);

        updateLoot();

        updateReload(delta);

        updateShooting(delta);

        updateDayNight(delta);

        updateHUD();

    }


    renderer.render(
        scene,
        camera
    );

}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
